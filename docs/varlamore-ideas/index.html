<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varlamore UIM Ideas</title>
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#231f1a; --muted:#6b6257; --line:#e2d9c8;
    --gold:#b8892b; --gold-soft:#f1e4c2; --red:#8b1a1a; --blue:#1d3f8f; --green:#2e6b3a;
    --npc:#fbf3df; --player:#e9eef9; --narr:#eeeeea; --shadow:0 1px 2px rgba(0,0,0,.06);
    --sidebar:260px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  a{color:var(--blue)}
  .layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
  nav.side{position:sticky;top:0;height:100vh;overflow:auto;background:#2b241c;color:#e9dfcd;padding:18px 14px}
  nav.side h1{font-size:17px;margin:0 0 4px;color:#fff}
  nav.side .sub{font-size:12px;color:#b9ad9a;margin-bottom:14px}
  nav.side a{display:block;color:#e9dfcd;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}
  nav.side a.sec{margin-top:10px;font-weight:600;color:#fff}
  nav.side a.sub-link{padding-left:22px;font-size:13px;color:#cfc3ae}
  nav.side a:hover,nav.side a.active{background:#3d3327}
  nav.side .progress{margin-top:16px;font-size:12px;color:#cfc3ae}
  nav.side .bar{height:8px;background:#4a3f32;border-radius:4px;overflow:hidden;margin-top:6px}
  nav.side .bar i{display:block;height:100%;background:var(--gold);width:0}
  main{padding:28px 40px 80px;max-width:1180px;margin:0 auto;width:100%}
  section{margin-bottom:56px;scroll-margin-top:16px}
  h2{font-size:26px;margin:0 0 6px;border-bottom:2px solid var(--gold);padding-bottom:6px}
  h3{font-size:19px;margin:28px 0 8px}
  h4{font-size:15px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  p.lead{color:var(--muted);margin:0 0 16px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);margin:14px 0}
  .card.tight{padding:12px 16px}
  .meta{font-size:13px;color:var(--muted)}
  .pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:#6a4c10;margin-right:6px;vertical-align:middle}
  .pill.pre{background:#e6eef9;color:#1d3f8f}
  .pill.post{background:#e6f4e8;color:#2e6b3a}
  .pill.type{background:#eee;color:#444}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
  .tabs button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  .tabs button.active{background:var(--gold);border-color:var(--gold);color:#fff}
  .tabs button.active .meta{color:#fff3d6}
  .hidden{display:none!important}
  .convo{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .row{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:start}
  .row .who{font-size:12px;color:var(--muted);padding-top:9px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .who.player{color:var(--blue)} .row .who.npc{color:var(--red)} .row .who.narr{color:#555}
  .bubble{padding:8px 12px;border-radius:10px;border:1px solid var(--line);overflow-wrap:anywhere}
  .bubble.npc{background:var(--npc)} .bubble.player{background:var(--player)} .bubble.narr{background:var(--narr);font-style:italic;text-align:center}
  .bubble.option{background:#fff;border-style:dashed}
  .score{display:flex;flex-direction:column;gap:4px}
  .score input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;text-align:center}
  .score input.filled{border-color:var(--gold);background:#fffaf0}
  .score input.low{background:#fdeaea;border-color:#d9a3a3}
  .score input.high{background:#e9f6ec;border-color:#9fcaa8}
  .note{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;resize:vertical;min-height:30px;font-family:inherit}
  .notebtn{border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:0;text-align:center}
  .notebtn:hover{color:var(--ink)} .notebtn.has{color:var(--gold);font-weight:600}
  .row .note{grid-column:2/4}
  .options{margin:10px 0 0 120px;padding:10px 12px;border-left:3px solid var(--gold);background:#fffaf0;border-radius:0 8px 8px 0}
  .options .title{font-size:13px;color:var(--red);font-weight:600;margin-bottom:6px;text-align:center}
  .option{margin:8px 0 14px}
  .option > .row{grid-template-columns:40px minmax(0,1fr) 92px}
  .option .num{font-weight:700;color:var(--gold);padding-top:8px;text-align:right}
  .option .ending{margin-left:40px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--gold-soft)}
  .tablewrap{overflow-x:auto;margin:10px 0}
  .idea{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px}
  .idea h5{margin:0 0 4px;font-size:16px}
  .idea .details{font-size:14px;color:#3a352e}
  .idea .src a{font-size:12px}
  details summary{cursor:pointer;color:var(--blue);font-size:14px}
  .export textarea{width:100%;min-height:220px;font:12px/1.4 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px}
  .btn{background:var(--gold);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px;margin-right:8px}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .toast{position:fixed;bottom:18px;right:18px;background:#2b241c;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .brief{background:#fff;border-left:3px solid var(--gold);padding:10px 14px;margin:8px 0 14px;font-size:14px}
  .kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:14px}
  .kv b{color:var(--muted);font-weight:600}
  .legend{font-size:13px;color:var(--muted)}
  code{background:#f0ebe0;padding:1px 5px;border-radius:4px;font-size:13px}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    nav.side{position:relative;height:auto;max-height:none}
    main{padding:18px 16px 60px}
    .row{grid-template-columns:70px minmax(0,1fr) 72px}
    .options{margin-left:0}
    .option > .row{grid-template-columns:28px minmax(0,1fr) 72px}
    .option .ending{margin-left:0}
    .idea{grid-template-columns:1fr}
    .kv{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">{"meta": {"title": "Varlamore UIM Ideas", "subtitle": "Dialogue drafts and plugin proposals to score"}, "overview": {"title": "Overview", "lead": "Dialogue drafts for the dock stand-ins, a proposal for who unlocks the charter ships, and plugin feature ideas for a Varlamore-locked Ultimate Ironman. Everything here is for you to score.", "blocks": [{"title": "How to score", "html": "<p>Every line, option, and idea has a box. <b>1 is useless, 100 is a masterpiece.<\/b> Leave a note when a number isn't enough. Scores save in this browser as you type. When you're done, go to <a href=\"#export\">Your scores<\/a>, press <b>Copy scores<\/b>, and paste the text to me.<\/p><p class=\"legend\">Colour hints: red box is 30 or under, green is 70 or over. The sidebar shows how much you've scored.<\/p>"}, {"title": "One thing to fix regardless of scores", "html": "<p>The feasibility challenger found an <b>open escape route<\/b> in the current plugin: three fairy rings sit inside Varlamore (AIS, AJP, CKQ), they are unlocked by the same quest that arms the lock, and nothing in the spell, item or NPC blockers touches them. A locked player can leave through a fairy ring today. The fix is a menu-click block on the ring's travel interface, filtered to codes that lead outside the region. It's listed under Other ideas as <i>Fairy ring lockdown<\/i>.<\/p>"}, {"title": "The premise everyone was given", "html": "<p>In this Varlamore nobody may sail out until they've proven they can fend for themselves. Champions of the Fortis Colosseum carry <b>Dizana's quiver<\/b> as proof. The people at the docks can't unlock anything; one person in the kingdom can. Writers were told only that, plus who their character is and where they stand. No existing lines, no plugin details, no instruction to hint at anything.<\/p>"}, {"title": "Who stands at the docks, and why these six", "html": "<p>The characters come from what the wiki says actually lives at each dock, not from what would be convenient.<\/p><ul><li><b>Sunset Coast<\/b> is a Fremennik village transplanted from Rellekka: fishers, a helmet smith, a fishing shop, shark on the ovens. So: a <b>Fremennik fisher<\/b> and a <b>pier drifter<\/b> who came off a charter ship once and never left.<\/li><li><b>Aldarin<\/b> is wine villas and the 400-year-old Moonrise winery over a rough south coast of dwarves and bandits. So: a <b>vineyard hand<\/b> minding a shipment, and a <b>coastal boatman<\/b> who moves cargo nobody declares.<\/li><li><b>Fortis Cothon<\/b> is the capital's Roman-style trade harbour with guards, knights, merchants and a shipwright. So: a <b>harbour guard<\/b> and a <b>dockworker<\/b>.<\/li><\/ul><p>Each has two independent writers. The guard also shows the version you approved earlier, for comparison. Full research is in <code>docs/varlamore-ideas/research/<\/code>.<\/p>"}, {"title": "What's in here", "html": "<ol><li><b>Unlock design<\/b>: four candidates for the NPC who lets you sail once you show the quiver, two existing NPCs to overlay and two new ones to spawn, each with a sample exchange.<\/li><li><b>Characters<\/b>: before-quiver and after-quiver conversations for all six, from two writers each. After-quiver versions send the player to the unlocker.<\/li><li><b>Progress tracking<\/b>, <b>Key items<\/b>, <b>Milestone-gated quality of life<\/b> and <b>Other ideas<\/b>: plugin proposals grounded in wiki facts about what a locked UIM can and cannot get.<\/li><\/ol>"}, {"title": "How this was made", "html": "<p>Five research agents mined the wiki (docks and geography, the Colosseum and who holds authority, items and shops, progression and milestones, real NPC voice samples). Twelve writers drafted independently from short briefs. Fact-checkers and challengers then reviewed every script against the wiki and the game's register, and writers revised. The plugin ideas went through a feasibility challenge against the RuneLite API. This page was checked in Chrome for overflow and clipping at desktop and narrow widths.<\/p>"}]}, "unlock": {"title": "Who unlocks the ships", "lead": "Once the player carries Dizana's quiver, the dock stand-ins send them to one person who grants passage. Four candidates: two existing NPCs we could overlay, two new NPCs we could spawn. Score each candidate overall and score their lines.", "intro_html": "<div class=\"card\"><h3 style=\"margin-top:0\">A lore constraint worth knowing<\/h3><p>The wiki is clear that Varlamore was never closed to outbound travel. Before <i>Children of the Sun<\/i> the kingdom was isolationist about letting people <b>in<\/b>, and Prince Itzla personally granted the player entry after they proved trustworthy. Charter ships, quetzals and fairy rings all run freely. So the plugin's gate should be framed as <b>personal<\/b>, the way the Musa Point customs officer and the Al Kharid border guard work: no captain will risk an unproven outsider, and one official won't vouch for you yet. Not \"the harbour is sealed.\" Every candidate below is written that way.<\/p><p>The quiver itself is described by the wiki as \"a quiver awarded to those who have proved their worth in the Colosseum\", and as one of many replicas of the original used by Dizana, the Heroine of the Hunt. That is the exact proof-of-worth the premise needs, without inventing anything.<\/p><\/div>", "candidates": [{"id": "registrar", "name": "Harbour Registrar (new NPC)", "type": "spawn a new NPC", "location": "Inside the Fortis Cothon dock building, at a desk near where the Trader crewmembers and Shipwright Sennia already stand. The wiki confirms no harbourmaster or customs NPC exists there today, so this fills a real gap.", "why": "Sits exactly at the choke point, the charter desk itself. Mirrors the real Customs officer at Musa Point who inspects people before departure. Nel's smuggling investigation at this very dock in Twilight's Promise already makes the Cothon a place with inspection stakes.", "pros": "Mechanically the cleanest: the dock NPCs at all three ports can say \"go to the harbour in the capital\" and mean one desk. We control the character completely. A tired clerk is a very OSRS archetype.", "cons": "Entirely invented, so it needs the most made-up lore. Needs a model with a chathead; a Varlamore citizen or shopkeeper model would do.", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_Cothon\">Wiki: Fortis Cothon<\/a> · <a href=\"https://oldschool.runescape.wiki/w/Customs_officer\">Wiki: Customs officer<\/a> · <a href=\"https://oldschool.runescape.wiki/w/Twilight%27s_Promise\">Wiki: Twilight's Promise<\/a>", "script": {"lines": [{"speaker": "P", "text": "Can you clear me for a ship out of Varlamore?"}, {"speaker": "N", "text": "Only if you're proven. They all say they are. Show me."}, {"speaker": "X", "text": "You show the registrar Dizana's quiver."}, {"speaker": "N", "text": "Huh. Real Colosseum work. Not a market copy."}, {"speaker": "N", "text": "You're in the ledger now. The crews won't argue with the ledger."}], "options": [{"label": "Thanks for your help.", "lines": [{"speaker": "N", "text": "It's the first entry I've enjoyed all week."}]}, {"label": "Does this ever expire?", "lines": [{"speaker": "N", "text": "Ink doesn't lift, iknami. You're written for good."}]}, {"label": "Long day?", "lines": [{"speaker": "N", "text": "Every day's long. The ships keep coming in."}]}]}, "script_without": {"lines": [{"speaker": "P", "text": "Can you clear me for a ship out of Varlamore?"}, {"speaker": "N", "text": "No. I clear the proven, and you're not on my list."}, {"speaker": "P", "text": "What counts as proven?"}, {"speaker": "N", "text": "Come back wearing something the Colosseum gave you."}], "options": [{"label": "Who decides that?", "lines": [{"speaker": "N", "text": "No captain wants that risk. I just keep the ledger."}]}, {"label": "Can't you make an exception?", "lines": [{"speaker": "N", "text": "I made one once. I'd rather not discuss it."}]}, {"label": "I'll come back proven.", "lines": [{"speaker": "N", "text": "They all say that. Some of them are."}]}]}}, {"id": "minimus", "name": "Minimus, Colosseum Master", "type": "overlay existing NPC", "location": "Fortis Colosseum entrance. Players already talk to him before every run and he already trades spare quivers.", "why": "He is the one who certifies Colosseum victories: \"the kingdom gave me the role of Colosseum Master.\" Extending him to \"you've proven yourself, I'll send word to the harbour\" needs no new lore, only a new branch.", "pros": "Established character, established voice, standing still at a known spot, reachable right after Children of the Sun. The player is already there the moment they win the quiver.", "cons": "No stated authority over ships; he answers to Ueman on holy matters and to nobody on harbour matters, so the writing must frame it as vouching, not decree. The overlay must not break his real Start-wave and reward dialogue.", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Minimus\">Wiki: Minimus<\/a> · <a href=\"https://oldschool.runescape.wiki/w/Fortis_Colosseum\">Wiki: Fortis Colosseum<\/a>", "script": {"lines": [{"speaker": "P", "text": "Minimus, can you get me a ship out of Varlamore?"}, {"speaker": "N", "text": "Ships? I'm no sailor. What's that on your back, though?"}, {"speaker": "X", "text": "You show Minimus Dizana's quiver."}, {"speaker": "N", "text": "Twelve waves, and Sol Heredit face down. That's not luck."}, {"speaker": "N", "text": "My word carries at the docks. Tell them the Master sent you."}], "options": [{"label": "Will they believe you?", "lines": [{"speaker": "N", "text": "They will. I've never had to say a thing twice."}]}, {"label": "Why does your word count?", "lines": [{"speaker": "N", "text": "The kingdom gave me this role. Word came with it."}]}, {"label": "Thanks, Minimus.", "lines": [{"speaker": "N", "text": "Don't thank me. Thank the twelve waves."}]}]}, "script_without": {"lines": [{"speaker": "P", "text": "Minimus, can you get me a ship out of Varlamore?"}, {"speaker": "N", "text": "Me? I run an arena, not a harbour."}, {"speaker": "P", "text": "So there's nothing you can do?"}, {"speaker": "N", "text": "Not for a Rookie. Prove yourself in my sand first."}], "options": [{"label": "How do I prove myself?", "lines": [{"speaker": "N", "text": "Twelve waves. Come out the other side. Simple enough."}]}, {"label": "That's a lot to ask.", "lines": [{"speaker": "N", "text": "Then the sea's not for you. Neither is my arena."}]}, {"label": "I'll think about it.", "lines": [{"speaker": "N", "text": "Everyone thinks about it. Fewer of them come back."}]}]}}, {"id": "steward", "name": "Colosseum Steward (new NPC)", "type": "spawn a new NPC", "location": "Just outside the Colosseum's main gate, on the path back toward the city, where players walk after collecting their reward.", "why": "The Colosseum already feeds a public reputation track (the Glory titles: Brawler, Challenger, Gladiator, Hero, Champion, Grand Champion). A steward who records champions for the Queen's ledger and writes a travel note is a small, consistent addition.", "pros": "Keeps Minimus's own voice untouched. Purpose-built to stand still. The unlock happens where the proof was earned.", "cons": "Invented character. Slightly redundant with Minimus standing a few tiles away.", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_Colosseum\">Wiki: Fortis Colosseum (Glory titles)<\/a>", "script": {"lines": [{"speaker": "P", "text": "I want passage overseas. Who signs for that?"}, {"speaker": "N", "text": "The Queen's ledger does. Have you anything worth entering?"}, {"speaker": "X", "text": "You show the steward Dizana's quiver."}, {"speaker": "N", "text": "A quiver off the sand. I've not written one this season."}, {"speaker": "N", "text": "The crews read champions' names. Yours will get you aboard."}], "options": [{"label": "What goes in the ledger?", "lines": [{"speaker": "N", "text": "Your name, the wave, and the day. Nothing more."}]}, {"label": "Does the Queen read it?", "lines": [{"speaker": "N", "text": "She reads the ones that matter. Yours might be one."}]}, {"label": "Goodbye, then.", "lines": [{"speaker": "N", "text": "Timoiva. Come back with a better story than most."}]}]}, "script_without": {"lines": [{"speaker": "P", "text": "I want passage overseas. Who signs for that?"}, {"speaker": "N", "text": "Nobody signs for an empty name. Mine is a champions' ledger."}, {"speaker": "P", "text": "So how do I get a name?"}, {"speaker": "N", "text": "Through that gate. Twelve waves. Then I'll dip my pen."}], "options": [{"label": "Who else could help me?", "lines": [{"speaker": "N", "text": "Nobody. The captains want a name they've heard of."}]}, {"label": "That seems steep.", "lines": [{"speaker": "N", "text": "It is. That's rather the point of the thing."}]}, {"label": "I'll come back.", "lines": [{"speaker": "N", "text": "They mostly don't. I'll leave the line empty."}]}]}}, {"id": "herminius", "name": "Curator Herminius, Grand Museum", "type": "overlay existing NPC", "location": "Grand Museum, north-eastern Civitas illa Fortis. Permanently stationed.", "why": "The city's authority on history and artefacts. A curator authenticating the quiver as the genuine Colosseum token and vouching for the bearer is a plausible civic chain.", "pros": "Thematically pleasant: a scholar recognising what the quiver means. Reachable without Ethically Acquired Antiquities.", "cons": "The wiki documents no tie between Herminius and the Colosseum or the harbour; this connection is inferred. A museum is an odd place to get permission to sail.", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Curator_Herminius\">Wiki: Curator Herminius<\/a>", "script": {"lines": [{"speaker": "P", "text": "Curator, I need a ship out of Varlamore. Can you vouch?"}, {"speaker": "N", "text": "Vouching is not my trade, iknami. Authenticating is. Show me."}, {"speaker": "X", "text": "You show Curator Herminius Dizana's quiver."}, {"speaker": "N", "text": "Indeed. Arena-made, and worn hard. This came off the sand."}, {"speaker": "N", "text": "I'll write to the harbour. My hand is known there."}], "options": [{"label": "Is it the original quiver?", "lines": [{"speaker": "N", "text": "No. A replica, though a very honest one."}]}, {"label": "Why would they listen?", "lines": [{"speaker": "N", "text": "Half the labels in this museum are in my hand."}]}, {"label": "Thank you, Curator.", "lines": [{"speaker": "N", "text": "Not a problem, iknami. Do come back and read something."}]}]}, "script_without": {"lines": [{"speaker": "P", "text": "Curator, I need a ship out of Varlamore. Can you vouch?"}, {"speaker": "N", "text": "For what, exactly? I authenticate objects. People are not objects."}, {"speaker": "P", "text": "Anything that proves I can look after myself."}, {"speaker": "N", "text": "Then bring me something the Colosseum gave you. Nothing else counts."}], "options": [{"label": "What would you accept?", "lines": [{"speaker": "N", "text": "A quiver from the sand. I would know it at once."}]}, {"label": "Could you make an exception?", "lines": [{"speaker": "N", "text": "I could. Then my word would be worth rather less."}]}, {"label": "I'll find something.", "lines": [{"speaker": "N", "text": "Not a problem, iknami. The museum keeps long hours."}]}]}}], "also_considered_html": "<div class=\"card tight\"><h4 style=\"margin-top:0\">Also considered, and why not<\/h4><ul><li><b>Shipwright Sennia<\/b> stands at the Cothon dock building already and could be overlaid, but she belongs to the Sailing skill and a shipwright has no reason to gate passengers.<\/li><li><b>Guard Captain<\/b>: right archetype, but stands in an underground barracks nobody passes.<\/li><li><b>Regulus Cento<\/b>: already authorises travel to Varlamore, but stands outside Varrock, outside the lock.<\/li><li><b>Prince Itzla Arkan<\/b>: the best narrative bookend (he granted entry, he grants exit), but he moves with the questline and is imprisoned mid-story.<\/li><\/ul><\/div>"}, "characters_title": "Dock characters", "characters_lead": "Six people who could believably stand where the charter crews stand. For each: two independent writers, plus the fact-checker's own alternative written after reviewing them. Every script went through two review rounds against real wiki transcripts. Score every line: 1 useless, 100 masterpiece. The 'Overall' box at the bottom of each script is the one that matters most if you're short on time.", "characters": [{"id": "fisher", "name": "Fremennik fisher", "dock": "Sunset Coast", "display": "Fisher", "brief": "Came south from Rellekka with the rest of the village years ago. Fishes sharks off the rocks, mends nets on the dock, sells to Picaria's shop. Knows tides, weather, boats, and Fremennik pride. Has never been to the capital and has no idea how the Kingdom works.", "place": "Sunset Coast: a small Fremennik fishing village on the savannah coast. Nets slapping pilings, gulls over fish guts, shark on the ovens, Thurid's anvil ringing up the street. Northerners a long way from home in the heat.", "models": "Fremennik NPC models (Rellekka villagers) or Sunset Coast villagers", "variants": [{"id": "fisher:reviewer:0", "title": "Out where", "author": "reviewer", "phase": "pre", "premise": "The fisher is knotting a torn net across his knee and does not stop.", "lines": [{"speaker": "P", "text": "Any chance of a boat out of Varlamore?"}, {"speaker": "N", "text": "Not mine."}, {"speaker": "P", "text": "Someone else's, then?"}, {"speaker": "N", "text": "Ask them."}, {"speaker": "X", "text": "The fisher bites the twine off and starts again."}], "options": [{"label": "Would you take me for coin?", "lines": [{"speaker": "N", "text": "No."}, {"speaker": "N", "text": "You'd be sick before the rocks."}]}, {"label": "You're not very friendly.", "lines": [{"speaker": "N", "text": "You're an outerlander. That's the whole of it."}]}, {"label": "Caught anything today?", "lines": [{"speaker": "N", "text": "Shark. Two."}, {"speaker": "P", "text": "Is that good?"}, {"speaker": "N", "text": "It's two more than you've caught."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Aye."}]}]}, {"id": "fisher:writer-a:0", "title": "Mending nets", "author": "writer-a", "phase": "pre", "premise": "The fisher sits on the dock with a torn net across his knees, working a needle through it.", "lines": [{"speaker": "P", "text": "Could you take me out on your boat?"}, {"speaker": "N", "text": "Don't talk to me outerlander. I'm mending this net."}, {"speaker": "P", "text": "It's a simple question."}, {"speaker": "N", "text": "And that's a simple answer. No."}, {"speaker": "X", "text": "He pulls the twine tight without looking up."}], "options": [{"label": "Who could take me, then?", "lines": [{"speaker": "N", "text": "Nobody who'd risk it on you."}, {"speaker": "N", "text": "Go and ask them yourself."}]}, {"label": "What happened to the net?", "lines": [{"speaker": "N", "text": "Shark went straight through it."}, {"speaker": "P", "text": "A big one?"}, {"speaker": "N", "text": "Big enough. It had the catch as well."}]}, {"label": "You're a long way from Rellekka.", "lines": [{"speaker": "N", "text": "Aye. And it's far too hot here for a proper beard."}, {"speaker": "N", "text": "The fish don't mind. I do."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Good."}]}]}, {"id": "fisher:writer-a:1", "title": "Gutting sharks", "author": "writer-a", "phase": "pre", "premise": "The fisher is gutting a shark on a barrel by the water while gulls scream overhead.", "lines": [{"speaker": "P", "text": "I'm after passage out of Varlamore. Any boats?"}, {"speaker": "N", "text": "Out where? There's nothing out there but water and weather."}, {"speaker": "P", "text": "Anywhere. I want to leave the kingdom."}, {"speaker": "N", "text": "Then you want the capital, not me. I fish."}, {"speaker": "X", "text": "He flicks the guts into the sea. The gulls dive for them."}], "options": [{"label": "Have you been to the capital?", "lines": [{"speaker": "N", "text": "Never. It's too far from the water for me."}, {"speaker": "N", "text": "Nothing up there but people."}]}, {"label": "What's the weather doing?", "lines": [{"speaker": "N", "text": "Wind's turning. There'll be swell by evening."}, {"speaker": "P", "text": "Bad for fishing?"}, {"speaker": "N", "text": "Bad for outerlanders in small boats."}]}, {"label": "Sell me that shark.", "lines": [{"speaker": "N", "text": "This one's promised. It's on the ovens tonight."}, {"speaker": "N", "text": "Buy it there like everyone else."}]}, {"label": "I'll leave you to it.", "lines": [{"speaker": "N", "text": "Aye. Mind the gulls."}]}]}, {"id": "fisher:writer-b:0", "title": "Mending Nets", "author": "writer-b", "phase": "pre", "premise": "The fisher crouches on the dock, working a bone needle through a torn net.", "lines": [{"speaker": "P", "text": "Any idea how I could get a boat out of here?"}, {"speaker": "N", "text": "Ships aren't my business. Talk to the harbour folk, not me."}, {"speaker": "P", "text": "So you don't know anything about it?"}, {"speaker": "N", "text": "I know sharks and tides. That's the lot."}, {"speaker": "X", "text": "The fisher tugs the knot tight without looking up."}], "options": [{"label": "Fair enough.", "lines": [{"speaker": "N", "text": "Suits me. Less talking."}]}, {"label": "What do Fremennik know, then?", "lines": [{"speaker": "N", "text": "Nets. Tides. Sharks. Good boats."}, {"speaker": "P", "text": "Nothing about ships leaving, though."}, {"speaker": "N", "text": "Not my trade, outerlander."}]}, {"label": "Thanks for nothing.", "lines": [{"speaker": "N", "text": "Don't mention it."}]}, {"label": "What are you fishing for?", "lines": [{"speaker": "N", "text": "Shark, off the rocks, when the tide allows it."}]}]}, {"id": "fisher:writer-b:1", "title": "Bad Catch", "author": "writer-b", "phase": "pre", "premise": "The fisher slams a half-full creel onto the dock, cursing the tide.", "lines": [{"speaker": "P", "text": "Is there a ship leaving the coast soon?"}, {"speaker": "N", "text": "Do I look like a ship to you?"}, {"speaker": "P", "text": "You don't sound like you'd help anyway."}, {"speaker": "N", "text": "I wouldn't."}, {"speaker": "X", "text": "The fisher spits over the rail and goes back to the ropes."}], "options": [{"label": "Rough day?", "lines": [{"speaker": "N", "text": "Half a creel of fish and a split net. Rough enough."}]}, {"label": "Just point me somewhere.", "lines": [{"speaker": "N", "text": "Rocks are that way. Fish are that way. Ships, no idea."}]}, {"label": "Never mind, then.", "lines": [{"speaker": "N", "text": "Good. Go bother someone else."}]}, {"label": "You Fremennik are all the same.", "lines": [{"speaker": "N", "text": "And proud of it."}, {"speaker": "P", "text": "Fair enough."}, {"speaker": "N", "text": "Move along, outerlander."}]}]}, {"id": "fisher:reviewer:1", "title": "Stayed for the fish", "author": "reviewer", "phase": "post", "premise": "The fisher is salting shark on a plank and stops when he sees the quiver.", "lines": [{"speaker": "P", "text": "Any chance of a boat out of Varlamore?"}, {"speaker": "X", "text": "The fisher looks up at the quiver on your back."}, {"speaker": "N", "text": "Half this village came south to fight for one of those."}, {"speaker": "P", "text": "And you?"}, {"speaker": "N", "text": "I came for the fish."}, {"speaker": "N", "text": "Take that to the harbour in the capital. Not to me."}], "options": [{"label": "Who do I show it to?", "lines": [{"speaker": "N", "text": "Whoever keeps the ledger up there."}, {"speaker": "N", "text": "I've never been. Too far from the water."}]}, {"label": "You could sail me yourself.", "lines": [{"speaker": "N", "text": "She's a fishing boat."}, {"speaker": "P", "text": "So?"}, {"speaker": "N", "text": "So you'd smell of shark for a week."}]}, {"label": "Ever thought of fighting there?", "lines": [{"speaker": "N", "text": "Thought about it."}, {"speaker": "N", "text": "Then I thought about the fish."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Don't thank me. I did nothing."}]}]}, {"id": "fisher:writer-a:2", "title": "The quiver", "author": "writer-a", "phase": "post", "premise": "The fisher is hauling a crate of shark up the dock when the player stops him.", "lines": [{"speaker": "P", "text": "I need a boat out of the kingdom."}, {"speaker": "X", "text": "The fisher sets the crate down and looks you over."}, {"speaker": "N", "text": "That thing on your back. You fought for it?"}, {"speaker": "P", "text": "In the Colosseum, yes."}, {"speaker": "N", "text": "Hah. Then you're not soft after all, outerlander."}, {"speaker": "N", "text": "Take it to the harbour in the capital. They keep a list there."}], "options": [{"label": "Who keeps the list?", "lines": [{"speaker": "N", "text": "Some clerk with a ledger. Registrar, they call him."}, {"speaker": "N", "text": "Never met him. Sounds miserable."}]}, {"label": "Could you sail me out yourself?", "lines": [{"speaker": "N", "text": "My boat's for fish, not passengers."}, {"speaker": "P", "text": "Not even for coin?"}, {"speaker": "N", "text": "Not even for coin. She stinks of shark."}]}, {"label": "Where is this harbour?", "lines": [{"speaker": "N", "text": "North of here. Civitas illa Fortis."}, {"speaker": "N", "text": "I've never seen it. Never wanted to."}, {"speaker": "N", "text": "Too many people, they tell me."}]}, {"label": "Thanks for the help.", "lines": [{"speaker": "N", "text": "Fair winds. You've earned that much."}]}]}, {"id": "fisher:writer-b:2", "title": "Quiver Recognised", "author": "writer-b", "phase": "post", "premise": "The fisher is coiling a wet line by the pilings when the player approaches.", "lines": [{"speaker": "P", "text": "Is there any way I could get a ship out of here?"}, {"speaker": "X", "text": "The fisher's eyes catch on the quiver on your back."}, {"speaker": "N", "text": "Colosseum-make, unless my eyes have gone soft."}, {"speaker": "P", "text": "Does that help me any?"}, {"speaker": "N", "text": "Not from me. But it might, up at the harbour in the capital."}], "options": [{"label": "Where's that, then?", "lines": [{"speaker": "N", "text": "Fortis Cothon, they call it. Ask for whoever runs the ledger."}]}, {"label": "You ever sailed there?", "lines": [{"speaker": "N", "text": "Never had reason to. My boats stay close to the rocks."}]}, {"label": "Not bad for an outerlander.", "lines": [{"speaker": "N", "text": "Didn't say that."}, {"speaker": "P", "text": "Close enough, then."}, {"speaker": "N", "text": "Don't push it."}]}, {"label": "I'll get moving.", "lines": [{"speaker": "N", "text": "Mind the tide on your way out, outerlander."}]}]}]}, {"id": "vagrant", "name": "Pier drifter", "dock": "Sunset Coast", "display": "Vagrant", "brief": "Sleeps under the pier. Not a Fremennik; stepped off a charter ship years back and never got on another. Lives on fish scraps and whatever the crews drop. Knows every crew by their boots, when ships come and go, which captain drinks. Knows nothing about laws except the ones that get you moved along.", "place": "Sunset Coast: a small Fremennik fishing village on the savannah coast. Nets slapping pilings, gulls over fish guts, shark on the ovens. Under the pier it is cool and smells of weed and old rope.", "models": "Tramp / Beggar / Drunken man style NPC models", "variants": [{"id": "vagrant:reviewer:0", "title": "The wrong boat", "author": "reviewer", "phase": "pre", "premise": "He is under the pier drying one boot on a warm rock.", "lines": [{"speaker": "P", "text": "Can you get me a ship out of here?"}, {"speaker": "N", "text": "I can get you Aldarin. Twenty coins."}, {"speaker": "P", "text": "That's not out of here."}, {"speaker": "N", "text": "It's out of here."}], "options": [{"label": "I meant a proper ship.", "lines": [{"speaker": "N", "text": "Charter crews want a name on you."}, {"speaker": "N", "text": "You haven't got one."}]}, {"label": "Who's taking twenty coins?", "lines": [{"speaker": "N", "text": "Antonia. She's got the boat."}, {"speaker": "N", "text": "I've got the pier."}]}, {"label": "Why is your boot on a rock?", "lines": [{"speaker": "N", "text": "It got wet."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Mind the nets."}]}]}, {"id": "vagrant:writer-a:0", "title": "Under the pier", "author": "writer-a", "phase": "pre", "premise": "He is picking through a bucket of fish scraps in the shade under the pier.", "lines": [{"speaker": "P", "text": "Any chance of a ship out of here?"}, {"speaker": "N", "text": "Depends whose boots you've got on."}, {"speaker": "P", "text": "My boots?"}, {"speaker": "N", "text": "Crews know their own. You're not one of them."}, {"speaker": "N", "text": "Try it. They'll enjoy that."}], "options": [{"label": "Which crew would take me?", "lines": [{"speaker": "N", "text": "None of them, not the way you're stood."}, {"speaker": "N", "text": "Something about the capital saying yes first."}]}, {"label": "You could've left years ago.", "lines": [{"speaker": "N", "text": "Could have. The ship went. I didn't."}, {"speaker": "P", "text": "Why not?"}, {"speaker": "N", "text": "Never got round to it."}]}, {"label": "Do you need anything?", "lines": [{"speaker": "N", "text": "Scraps come off the ovens at dusk. I'm all right."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Mind the nets on your way out."}]}]}, {"id": "vagrant:writer-a:1", "title": "Boots and bells", "author": "writer-a", "phase": "pre", "premise": "He is sat with his back to a piling, watching a charter crew load crates.", "lines": [{"speaker": "P", "text": "I'm after passage on a boat."}, {"speaker": "N", "text": "That one's loaded. Sails at dusk if the captain stands."}, {"speaker": "P", "text": "Would he take me?"}, {"speaker": "N", "text": "He'd take anyone. The harbour won't."}, {"speaker": "N", "text": "A lad tried last week. Came straight back."}], "options": [{"label": "What stops the harbour?", "lines": [{"speaker": "N", "text": "Proof of something. I only hear the shouting."}, {"speaker": "P", "text": "Fair enough."}]}, {"label": "How do you know the ships?", "lines": [{"speaker": "N", "text": "Boots. Every crew wears its own."}, {"speaker": "N", "text": "Yours have never been wet."}]}, {"label": "Which captain drinks?", "lines": [{"speaker": "N", "text": "All of them. Some start earlier."}]}, {"label": "I'll try anyway.", "lines": [{"speaker": "N", "text": "Go on, then."}, {"speaker": "N", "text": "I'll be here after."}]}]}, {"id": "vagrant:writer-b:0", "title": "Boots, Not Boats", "author": "writer-b", "phase": "pre", "premise": "He's crouched under the pier, sorting fish scraps into a sack.", "lines": [{"speaker": "P", "text": "Any chance you know how to get a boat out of here?"}, {"speaker": "N", "text": "Boats aren't my trade. Boots are."}, {"speaker": "P", "text": "That's not what I meant."}, {"speaker": "N", "text": "Crew boots. I know who's ashore without looking."}, {"speaker": "P", "text": "That's not helping me leave."}, {"speaker": "N", "text": "Never said it would."}], "options": [{"label": "Who's your favourite crew?", "lines": [{"speaker": "N", "text": "The shark boat. Never shorts me on scraps."}]}, {"label": "Can't you just stow away?", "lines": [{"speaker": "N", "text": "Tried that once. Never again."}, {"speaker": "P", "text": "What happened to you?"}, {"speaker": "N", "text": "Boots. Someone else's, in my ribs."}]}, {"label": "Forget it, I'll ask elsewhere.", "lines": [{"speaker": "N", "text": "Good. Fewer questions for me."}]}, {"label": "Do you get lonely under here?", "lines": [{"speaker": "N", "text": "Gulls don't ask questions."}]}]}, {"id": "vagrant:writer-b:1", "title": "Watching the Gangplank", "author": "writer-b", "phase": "pre", "premise": "He's leaning on a piling at dusk, watching a ship dock.", "lines": [{"speaker": "P", "text": "Is there any way to get a boat out of Varlamore?"}, {"speaker": "N", "text": "You running from something?"}, {"speaker": "P", "text": "No. I just want off this coast."}, {"speaker": "N", "text": "That's what they all say."}, {"speaker": "X", "text": "He watches the gangplank a moment longer."}], "options": [{"label": "Who says that?", "lines": [{"speaker": "N", "text": "Deckhands, mostly. Same words every time."}]}, {"label": "I'm not hiding anything.", "lines": [{"speaker": "N", "text": "Never met one who was."}]}, {"label": "None of your business.", "lines": [{"speaker": "N", "text": "Fair enough. Not looking for one myself."}]}, {"label": "Just tell me what you know.", "lines": [{"speaker": "N", "text": "I know boots. Crews. Who's short-tempered before noon."}, {"speaker": "P", "text": "That's all you know?"}, {"speaker": "N", "text": "That's plenty, some days."}]}]}, {"id": "vagrant:reviewer:1", "title": "The ledger", "author": "reviewer", "phase": "post", "premise": "He is sat against a piling, half asleep, when the player stands over him.", "lines": [{"speaker": "P", "text": "Can you get me a ship out of here?"}, {"speaker": "X", "text": "The vagrant looks at the quiver, then at your boots."}, {"speaker": "N", "text": "Still no. Crews can't read."}, {"speaker": "P", "text": "Who can?"}, {"speaker": "N", "text": "Bloke with the ledger. The Cothon, in the capital."}], "options": [{"label": "How do you know him?", "lines": [{"speaker": "N", "text": "He wrote me down once."}, {"speaker": "N", "text": "Nothing came of it."}]}, {"label": "Come with me.", "lines": [{"speaker": "N", "text": "On a ship? No."}, {"speaker": "N", "text": "Ships smell worse than this."}]}, {"label": "What should I expect?", "lines": [{"speaker": "N", "text": "He'll look at your boots."}, {"speaker": "N", "text": "Everyone does."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Don't. Just go."}]}]}, {"id": "vagrant:writer-a:2", "title": "The quiver", "author": "writer-a", "phase": "post", "premise": "He is coiling a length of rope the crews dropped under the pier.", "lines": [{"speaker": "P", "text": "I need a ship out of Varlamore."}, {"speaker": "X", "text": "The vagrant sits up and looks at the quiver."}, {"speaker": "N", "text": "So you're one of the arena lot."}, {"speaker": "P", "text": "The Colosseum, yes."}, {"speaker": "N", "text": "That's the one. The crews talk about it all night."}, {"speaker": "N", "text": "Take it to the harbour in the capital. They read that sort of thing."}], "options": [{"label": "Who reads it?", "lines": [{"speaker": "N", "text": "The one with the big book, down at the Cothon."}, {"speaker": "N", "text": "Registrar, I heard a mate call him."}]}, {"label": "You know the Cothon?", "lines": [{"speaker": "N", "text": "Stepped off there years back."}, {"speaker": "N", "text": "Walked out and never went in again."}]}, {"label": "Come with me.", "lines": [{"speaker": "N", "text": "And do what? Stand about on a nicer deck?"}, {"speaker": "P", "text": "Fair enough."}, {"speaker": "N", "text": "Send word when you're out."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Don't come back this way. There's nothing here."}]}]}, {"id": "vagrant:writer-b:2", "title": "A Second Look", "author": "writer-b", "phase": "post", "premise": "He's under the pier when he spots the quiver on your back.", "lines": [{"speaker": "P", "text": "Do you know how I could get a boat out of here?"}, {"speaker": "N", "text": "Not from me. That thing on your back might."}, {"speaker": "P", "text": "You know what this is?"}, {"speaker": "N", "text": "Colosseum prize. Take it to the harbour, up in the capital."}, {"speaker": "X", "text": "He nods inland, north."}], "options": [{"label": "Have you been there?", "lines": [{"speaker": "N", "text": "Me? No. Watched men limp back from it, though."}]}, {"label": "Why can't you help me sail?", "lines": [{"speaker": "N", "text": "No standing with the crews. Never have."}]}, {"label": "Thanks for the advice.", "lines": [{"speaker": "N", "text": "Don't thank me. Thank whoever gave you that."}]}, {"label": "I'll head there now.", "lines": [{"speaker": "N", "text": "You'll want better boots than those."}]}]}]}, {"id": "vineyard", "name": "Vineyard hand", "dock": "Aldarin", "display": "Vineyard worker", "brief": "Picks grapes for the Moonrise foreman. Sent down to the dock to watch a wine shipment that is waiting to be loaded. Knows grapes, harvest, the foreman's temper, and villa gossip. Has never been on a ship and would rather not.", "place": "Aldarin: an island of vineyards and rich villas with a rough, rocky south coast where dwarves and bandits live. At the dock: crates of wine, the smell of fermenting must from the brewery, gulls and surf, Mistrock's stone dust on the wind.", "models": "Vineyard worker / Vineyard foreman (Aldarin) NPC models", "variants": [{"id": "vineyard:reviewer:0", "title": "Not my crates", "author": "reviewer", "phase": "pre", "premise": "He is stacking wine crates on the dock and does not stop stacking.", "lines": [{"speaker": "P", "text": "Is there a ship out of here?"}, {"speaker": "N", "text": "Ask the crew. I do grapes."}, {"speaker": "P", "text": "You must know something."}, {"speaker": "N", "text": "I know these crates are going on. You're not."}], "options": [{"label": "Why not me?", "lines": [{"speaker": "N", "text": "No captain wants the bother."}]}, {"label": "What's in the crates?", "lines": [{"speaker": "N", "text": "Wine. Moonrise red, the dear stuff."}, {"speaker": "P", "text": "Is it any good?"}, {"speaker": "N", "text": "Not for the likes of us. Don't lean on it."}]}, {"label": "Ever been on a ship?", "lines": [{"speaker": "N", "text": "No. The grapes stay put and so do I."}]}, {"label": "I'll leave you to it.", "lines": [{"speaker": "N", "text": "Timoiva. Mind the gulls."}]}]}, {"id": "vineyard:writer-a:0", "title": "Counting crates", "author": "writer-a", "phase": "pre", "premise": "He is counting the wine crates on the dock and keeps losing his place.", "lines": [{"speaker": "P", "text": "Any chance of getting a ship out of here?"}, {"speaker": "N", "text": "Tetamo. You've made me lose count again."}, {"speaker": "N", "text": "Twelve, thirteen... no. Back to one."}, {"speaker": "P", "text": "Sorry. I only want passage somewhere."}, {"speaker": "N", "text": "Then ask a sailor. I pick grapes."}], "options": [{"label": "Who's in charge of the crates?", "lines": [{"speaker": "N", "text": "The foreman. He's up at the vineyard."}, {"speaker": "N", "text": "Don't tell him I lost count."}]}, {"label": "What's in the crates?", "lines": [{"speaker": "N", "text": "Wine. Last year's, off the north slope."}, {"speaker": "P", "text": "Is it any good?"}, {"speaker": "N", "text": "You won't regret it if you try some."}]}, {"label": "Have you ever sailed?", "lines": [{"speaker": "N", "text": "Never. I'd like to keep it that way."}, {"speaker": "N", "text": "Water's for the grapes."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Mind the gulls on your way past."}]}]}, {"id": "vineyard:writer-a:1", "title": "Foreman's temper", "author": "writer-a", "phase": "pre", "premise": "He is sat on a crate waiting on the dwarves' cart from Mistrock, glad of someone to talk at.", "lines": [{"speaker": "P", "text": "I'm after a boat off this island. Know anyone?"}, {"speaker": "N", "text": "Nilsal. Sit down before somebody sees you standing about."}, {"speaker": "N", "text": "The foreman, I mean. He's about somewhere."}, {"speaker": "P", "text": "So no boat, then."}, {"speaker": "N", "text": "Not from me, iknami. I watch crates, that's all."}], "options": [{"label": "Why's he so sour?", "lines": [{"speaker": "N", "text": "His brother married into the big villa."}, {"speaker": "N", "text": "Now he's got a temper and no vines."}]}, {"label": "Does anyone sail out?", "lines": [{"speaker": "N", "text": "They try. Then they come back grumbling."}, {"speaker": "N", "text": "Something about the capital saying no."}]}, {"label": "How's the harvest?", "lines": [{"speaker": "N", "text": "The grapes are in good shape this year."}, {"speaker": "N", "text": "Shame about everything else."}]}, {"label": "I'll leave you to it.", "lines": [{"speaker": "N", "text": "Timoiva. Say nothing about the crate."}]}]}, {"id": "vineyard:writer-b:0", "title": "Watching Crates", "author": "writer-b", "phase": "pre", "premise": "He's counting wine crates on the dock, checking them off his list.", "lines": [{"speaker": "P", "text": "Any ships sailing out from here?"}, {"speaker": "N", "text": "Ask the crew. I've a list to finish, iknami."}, {"speaker": "N", "text": "And not for you either, from what I hear."}, {"speaker": "P", "text": "What have you heard?"}, {"speaker": "N", "text": "No captain takes an unproven stranger. That's all."}], "options": [{"label": "Is that wine in the crates?", "lines": [{"speaker": "N", "text": "Moonrise reds, best batch the foreman's had in years."}, {"speaker": "N", "text": "Try a cup sometime. You won't regret it."}]}, {"label": "What's the foreman like?", "lines": [{"speaker": "N", "text": "Bellows like a bull if the grapes bruise."}, {"speaker": "X", "text": "The worker checks the list again."}]}, {"label": "Never been on a ship?", "lines": [{"speaker": "N", "text": "Never. Don't plan to start today."}, {"speaker": "N", "text": "Boats are for other people."}]}, {"label": "I'll leave you to it.", "lines": [{"speaker": "N", "text": "Timoiva."}]}]}, {"id": "vineyard:writer-b:1", "title": "Grapes and Gulls", "author": "writer-b", "phase": "pre", "premise": "He's leaning on a crate, watching gulls squabble over spilled grapes.", "lines": [{"speaker": "P", "text": "Could I get passage on a ship from here?"}, {"speaker": "N", "text": "Not from me. I've never owned a boat."}, {"speaker": "N", "text": "Grapes don't need boats. Neither do I."}, {"speaker": "P", "text": "You've really never sailed?"}, {"speaker": "N", "text": "Once, nearly. Turned green before we left the dock."}], "options": [{"label": "That's a shame", "lines": [{"speaker": "N", "text": "Isn't it just. Timoiva."}]}, {"label": "How's the harvest?", "lines": [{"speaker": "N", "text": "Good shape this harvest, better than last year's."}, {"speaker": "N", "text": "Foreman's pleased, for once."}]}, {"label": "Why can't I get passage?", "lines": [{"speaker": "N", "text": "Something about proving yourself first. Don't ask me the details."}, {"speaker": "N", "text": "I just watch crates, iknami."}]}, {"label": "I'll get out of your way.", "lines": [{"speaker": "N", "text": "Mind the gulls on your way out."}]}]}, {"id": "vineyard:reviewer:1", "title": "The quiver", "author": "reviewer", "phase": "post", "premise": "He is eating his lunch on the crates when he notices what is on the player's back.", "lines": [{"speaker": "P", "text": "Is there a ship out of here?"}, {"speaker": "X", "text": "The worker looks up from his lunch."}, {"speaker": "N", "text": "Tetamo. Where'd you get that quiver?"}, {"speaker": "P", "text": "In the Colosseum."}, {"speaker": "N", "text": "Then don't waste it on me. Go to the capital."}], "options": [{"label": "Where in the capital?", "lines": [{"speaker": "N", "text": "The Cothon. North side of the city."}, {"speaker": "N", "text": "Ask whoever keeps the ledger."}]}, {"label": "You know what it means?", "lines": [{"speaker": "N", "text": "My cousin won't shut up about them."}, {"speaker": "N", "text": "He hasn't got one."}]}, {"label": "Want a look at it?", "lines": [{"speaker": "N", "text": "No. Show the ledger man, not me."}, {"speaker": "N", "text": "I've crates to count."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Timoiva. Try not to drown."}]}]}, {"id": "vineyard:writer-a:2", "title": "Shiny back", "author": "writer-a", "phase": "post", "premise": "He is eating his lunch on the wine crates when he notices what the player is wearing.", "lines": [{"speaker": "P", "text": "I need a ship. Can anyone here help me?"}, {"speaker": "X", "text": "The worker stops chewing and stares at your back."}, {"speaker": "N", "text": "Tetamo. That's the one from the fighting pit."}, {"speaker": "P", "text": "The Colosseum, yes."}, {"speaker": "N", "text": "Then you're not my trouble. You're the harbour's."}], "options": [{"label": "Which harbour?", "lines": [{"speaker": "N", "text": "The big one at the capital. The Cothon."}, {"speaker": "N", "text": "There's a fellow there with a ledger."}, {"speaker": "N", "text": "He decides. Not me."}]}, {"label": "You know this quiver?", "lines": [{"speaker": "N", "text": "My cousin described it once. Bragged for weeks."}, {"speaker": "N", "text": "He never got one. Go on, the capital."}]}, {"label": "Want a closer look?", "lines": [{"speaker": "N", "text": "No. Show it to the ledger fellow, not me."}, {"speaker": "N", "text": "I've grapes to think about."}]}, {"label": "Thanks for the help.", "lines": [{"speaker": "N", "text": "Timoiva. Try the capital harbour."}]}]}, {"id": "vineyard:writer-b:2", "title": "The Quiver", "author": "writer-b", "phase": "post", "premise": "He's stacking empty crates, whistling an old harvest tune.", "lines": [{"speaker": "P", "text": "Any ships sailing out from here?"}, {"speaker": "X", "text": "The worker eyes the quiver slung on your back."}, {"speaker": "N", "text": "Tetamo, wherever did you get that?"}, {"speaker": "P", "text": "I won it. In the Colosseum."}, {"speaker": "N", "text": "Well then, that changes things, doesn't it."}, {"speaker": "N", "text": "Someone at the harbour in the capital will sort you out."}], "options": [{"label": "Where's the capital harbour?", "lines": [{"speaker": "N", "text": "North side of the capital. Ask the crew here."}]}, {"label": "What do I do there?", "lines": [{"speaker": "N", "text": "Ask for whoever keeps the ledger. That's above my head."}, {"speaker": "N", "text": "Good luck to you, iknami."}]}, {"label": "Thanks for the help", "lines": [{"speaker": "N", "text": "Thank me when you're on a ship. Timoiva."}]}, {"label": "I'd best be off.", "lines": [{"speaker": "N", "text": "Mind the crates on your way past."}]}]}]}, {"id": "boatman", "name": "Coastal boatman", "dock": "Aldarin", "display": "Boatman", "brief": "Rows a small boat along Aldarin's rocky south coast, where the dwarves and bandits are. Moves cargo people would rather not declare. Knows every cove, every tide, and which guards look the other way. Stays out of the capital on purpose.", "place": "Aldarin: an island of vineyards and rich villas with a rough, rocky south coast where dwarves and bandits live. At the dock: crates of wine, the smell of fermenting must from the brewery, gulls and surf, Mistrock's stone dust on the wind.", "models": "Bandit / Sailor (Varlamore) / Pirate style NPC models", "variants": [{"id": "boatman:reviewer:0", "title": "Coast work", "author": "reviewer", "phase": "pre", "premise": "He is dragging a wine crate down the pier steps and doesn't stop for you.", "lines": [{"speaker": "P", "text": "Can you get me off this island?"}, {"speaker": "N", "text": "As far as Mistrock. That's still the island."}, {"speaker": "P", "text": "I meant out of Varlamore."}, {"speaker": "N", "text": "Then you want a charter captain. Not me."}, {"speaker": "X", "text": "He shoulders the crate and waits for you to move."}], "options": [{"label": "Would a captain take me?", "lines": [{"speaker": "N", "text": "They don't know you. That's the whole of it."}]}, {"label": "What's in the crate?", "lines": [{"speaker": "N", "text": "Ask the label."}, {"speaker": "P", "text": "The label says wine."}, {"speaker": "N", "text": "There you go."}]}, {"label": "I'll pay you double.", "lines": [{"speaker": "N", "text": "Last one said double. He swam back."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Mind the steps. They're greasy."}]}]}, {"id": "boatman:writer-a:0", "title": "Coves not kingdoms", "author": "writer-a", "phase": "pre", "premise": "The boatman is bailing seawater out of his little boat at the far end of the pier.", "lines": [{"speaker": "P", "text": "Any chance of a lift out of Varlamore?"}, {"speaker": "N", "text": "Out? I go along the coast, iknami. Not out."}, {"speaker": "P", "text": "What's the difference?"}, {"speaker": "N", "text": "The difference is who's waiting at the other end."}, {"speaker": "N", "text": "I know the coves. That's all."}], "options": [{"label": "What's in the crates?", "lines": [{"speaker": "N", "text": "Wine."}, {"speaker": "P", "text": "Just wine?"}, {"speaker": "N", "text": "Wine's what's written on them."}]}, {"label": "I can pay you well.", "lines": [{"speaker": "N", "text": "Money's the easy part."}, {"speaker": "N", "text": "Getting stopped is the expensive part."}]}, {"label": "Who would stop us?", "lines": [{"speaker": "N", "text": "Someone in the capital, I hear. Never asked."}, {"speaker": "N", "text": "My boat's never been in a book. Keeping it that way."}]}, {"label": "Fair enough.", "lines": [{"speaker": "N", "text": "Mind the ropes on your way back up."}]}]}, {"id": "boatman:writer-a:1", "title": "Tide's out", "author": "writer-a", "phase": "pre", "premise": "The boatman sits on a wine crate at the pier's end, watching the water pull off the rocks.", "lines": [{"speaker": "P", "text": "Could you row me past the kingdom's waters?"}, {"speaker": "N", "text": "Nilsal. No."}, {"speaker": "P", "text": "That was quick."}, {"speaker": "N", "text": "Not on this tide. Not on any."}, {"speaker": "N", "text": "Coast work only. I like my boat unburnt."}], "options": [{"label": "Who'd burn your boat?", "lines": [{"speaker": "N", "text": "Bandits, mostly. They watch the coves too."}, {"speaker": "N", "text": "Very thorough men."}]}, {"label": "Nobody would ever know.", "lines": [{"speaker": "N", "text": "Somebody always knows."}, {"speaker": "N", "text": "That's how I eat, most weeks."}]}, {"label": "Don't the guards mind?", "lines": [{"speaker": "N", "text": "Half of them wave me through the cove at dusk."}, {"speaker": "P", "text": "And the other half?"}, {"speaker": "N", "text": "The other half I go round."}]}, {"label": "I'll be off, then.", "lines": [{"speaker": "N", "text": "Mind the stone dust. Gets in everything down here."}]}]}, {"id": "boatman:writer-b:0", "title": "Wine Crates", "author": "writer-b", "phase": "pre", "premise": "He's stacking crates of wine at the end of the pier, ready to shove off.", "lines": [{"speaker": "P", "text": "Can you take me out on the water?"}, {"speaker": "N", "text": "Not you, not today. Got wine to move."}, {"speaker": "X", "text": "A gull screeches over the crates and he swears at it."}, {"speaker": "N", "text": "Even if I hadn't. I don't cross open water."}], "options": [{"label": "Why not?", "lines": [{"speaker": "N", "text": "No captain takes a stranger. Their boats, their call."}, {"speaker": "P", "text": "Says who?"}, {"speaker": "N", "text": "Don't ask me, iknami. I just row the crates."}]}, {"label": "Who decides that?", "lines": [{"speaker": "N", "text": "Captains do. Ask one."}, {"speaker": "N", "text": "They'll say no slower than I did."}]}, {"label": "Nice wine you've got there.", "lines": [{"speaker": "N", "text": "Aldarin's finest. Don't touch the crates."}, {"speaker": "P", "text": "Wasn't going to."}, {"speaker": "N", "text": "Good. Last one who did went home wet."}]}, {"label": "Fine, I'll walk.", "lines": [{"speaker": "N", "text": "Suit yourself. It's an island, mind."}]}]}, {"id": "boatman:writer-b:1", "title": "Rough Company", "author": "writer-b", "phase": "pre", "premise": "He's watching the coast road for bandits before he'll cast off.", "lines": [{"speaker": "P", "text": "Got room on your boat for a paying passenger?"}, {"speaker": "N", "text": "Depends what you're paying with, and where you think you're going."}, {"speaker": "X", "text": "He glances up the cliff path, then back to you."}, {"speaker": "N", "text": "Out past Varlamore? Not in this boat."}], "options": [{"label": "Why not?", "lines": [{"speaker": "N", "text": "Charter captains won't risk a stranger."}, {"speaker": "N", "text": "Take it up with them, not me."}]}, {"label": "I could pay well.", "lines": [{"speaker": "N", "text": "Keep your coin. I don't do open water."}]}, {"label": "Are you smuggling something?", "lines": [{"speaker": "N", "text": "Wine. It's always wine."}, {"speaker": "P", "text": "That sounds illegal."}, {"speaker": "N", "text": "Then don't say it out loud."}]}, {"label": "Forget it.", "lines": [{"speaker": "N", "text": "Wise choice, iknami."}]}]}, {"id": "boatman:reviewer:1", "title": "Off the ledger", "author": "reviewer", "phase": "post", "premise": "He has one foot in the boat, ready to shove off, and stops.", "lines": [{"speaker": "P", "text": "I need a ship out of Varlamore."}, {"speaker": "X", "text": "He looks at the quiver, then at his boat."}, {"speaker": "N", "text": "Colosseum, that. Thought those were a story."}, {"speaker": "P", "text": "So can you take me?"}, {"speaker": "N", "text": "No. But the registrar will write you down."}, {"speaker": "N", "text": "Cothon, up in the capital. Ask for him."}], "options": [{"label": "You know the registrar?", "lines": [{"speaker": "N", "text": "I know who keeps the ledger."}, {"speaker": "N", "text": "It's my business to know. Not to visit."}]}, {"label": "Why not row me yourself?", "lines": [{"speaker": "N", "text": "You'll be in a book by evening."}, {"speaker": "N", "text": "I've kept out of books this long."}]}, {"label": "Come with me.", "lines": [{"speaker": "N", "text": "To that harbour? No."}, {"speaker": "N", "text": "They've a very good memory there."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Timoiva. Don't mention the crates."}]}]}, {"id": "boatman:writer-a:2", "title": "Name in a book", "author": "writer-a", "phase": "post", "premise": "The boatman is shoving crates under a tarpaulin, and stops dead when he sees the quiver.", "lines": [{"speaker": "P", "text": "I still need a ship out of Varlamore."}, {"speaker": "X", "text": "The boatman drops the tarpaulin and looks up."}, {"speaker": "N", "text": "Tetamo. That's a Colosseum quiver."}, {"speaker": "P", "text": "It is."}, {"speaker": "N", "text": "Then you don't want me. You want the capital."}, {"speaker": "N", "text": "Harbour registrar, up at the Cothon. He keeps the ledger."}], "options": [{"label": "Why not row me yourself?", "lines": [{"speaker": "N", "text": "Because your name goes in a book now."}, {"speaker": "N", "text": "Mine never has. Let's keep us both happy."}]}, {"label": "Where's the Cothon?", "lines": [{"speaker": "N", "text": "Big harbour in Civitas illa Fortis. You can't miss it."}, {"speaker": "N", "text": "Ask for the registrar. He'll be the bored one."}]}, {"label": "You won't come with me?", "lines": [{"speaker": "N", "text": "I've not set foot in that city in nine years."}, {"speaker": "P", "text": "Why not?"}, {"speaker": "N", "text": "Too many people there remember faces."}]}, {"label": "Thanks for that.", "lines": [{"speaker": "N", "text": "Timoiva."}, {"speaker": "N", "text": "Don't tell him where you heard it."}]}]}, {"id": "boatman:writer-b:2", "title": "Proof Enough", "author": "writer-b", "phase": "post", "premise": "He's untying his boat, ready to shove off without waiting for anyone.", "lines": [{"speaker": "P", "text": "Any chance of a boat now?"}, {"speaker": "N", "text": "That quiver. Colosseum, isn't it?"}, {"speaker": "X", "text": "He looks you over properly for the first time."}, {"speaker": "N", "text": "Tetamo. You actually did it, then."}], "options": [{"label": "Can you take me now?", "lines": [{"speaker": "N", "text": "Not me. You want the harbour in the capital for that."}, {"speaker": "N", "text": "I just do the coast, iknami."}]}, {"label": "Does that change anything?", "lines": [{"speaker": "N", "text": "Show it at the harbour, up in the capital."}, {"speaker": "P", "text": "Is that really it?"}, {"speaker": "N", "text": "That's what I hear. Never seen it myself."}]}, {"label": "Thanks for the help.", "lines": [{"speaker": "N", "text": "Didn't do much. Ask at the capital harbour."}]}, {"label": "You've heard of this before?", "lines": [{"speaker": "N", "text": "Only rumours. Never paid them much mind."}, {"speaker": "N", "text": "Now go bother the harbour in the capital."}]}]}]}, {"id": "guard", "name": "Harbour guard", "dock": "Fortis Cothon", "display": "Guard", "brief": "A city guard of Civitas illa Fortis posted at the charter berth in the Cothon. Stands there all day. Takes orders, gives none. Knows the rules he was told and nothing about why. Not one of the Kualti, and knows it.", "place": "Fortis Cothon: the capital's big Roman-style harbour. Spice and fur stalls, tar and brine, a blacksmith's hammer, bread from the bakers, the Flaming Arrow pub getting loud. Knights and guards about; Shipwright Sennia and the charter crews at the dock building.", "models": "Guard (Varlamore) NPC model", "variants": [{"id": "guard:current-approved-by-you:0", "title": "Not for you", "author": "current (approved by you)", "phase": "pre", "premise": "The version you approved earlier, here for comparison.", "lines": [{"speaker": "P", "text": "Any ships sailing today?"}, {"speaker": "N", "text": "Not for you."}, {"speaker": "P", "text": "Why not?"}, {"speaker": "N", "text": "Next question."}], "options": [{"label": "Who is allowed on, then?", "lines": [{"speaker": "N", "text": "Champions."}]}, {"label": "Can't you make an exception?", "lines": [{"speaker": "N", "text": "No."}]}, {"label": "Do you say anything other than no?", "lines": [{"speaker": "N", "text": "No."}]}, {"label": "What if I'm a champion?", "lines": [{"speaker": "N", "text": "You're not."}]}]}, {"id": "guard:reviewer:0", "title": "Wrong queue", "author": "reviewer", "phase": "pre", "premise": "The guard stands at the berth watching a rope being coiled.", "lines": [{"speaker": "P", "text": "Can I get on a ship out of here?"}, {"speaker": "N", "text": "Not that one."}, {"speaker": "P", "text": "Which one, then?"}, {"speaker": "N", "text": "None of them."}, {"speaker": "X", "text": "The guard goes back to watching the rope."}], "options": [{"label": "Says who?", "lines": [{"speaker": "N", "text": "Me."}, {"speaker": "P", "text": "That's it?"}, {"speaker": "N", "text": "That's it."}]}, {"label": "What would change your mind?", "lines": [{"speaker": "N", "text": "Nothing you've got."}]}, {"label": "Do you ever move?", "lines": [{"speaker": "N", "text": "When I'm relieved."}, {"speaker": "P", "text": "When's that?"}, {"speaker": "N", "text": "Later."}]}, {"label": "Fine.", "lines": [{"speaker": "N", "text": "Fair enough."}]}]}, {"id": "guard:writer-a:0", "title": "Standing orders", "author": "writer-a", "phase": "pre", "premise": "The guard is at his post by the berth, watching the gangplank.", "lines": [{"speaker": "P", "text": "Is there a boat here that'll take me out of Varlamore?"}, {"speaker": "N", "text": "There is. You can't board it."}, {"speaker": "P", "text": "Why not?"}, {"speaker": "N", "text": "My orders. Strangers don't board unvouched."}, {"speaker": "P", "text": "Vouched by who?"}, {"speaker": "N", "text": "That's above my rank."}], "options": [{"label": "Who gives you your orders?", "lines": [{"speaker": "N", "text": "My captain. He gets his from higher."}, {"speaker": "N", "text": "That's the whole of it."}]}, {"label": "I could just board it.", "lines": [{"speaker": "N", "text": "You could try."}, {"speaker": "X", "text": "The guard doesn't move."}, {"speaker": "N", "text": "Don't."}]}, {"label": "Is there another way out?", "lines": [{"speaker": "N", "text": "Not from this berth."}, {"speaker": "N", "text": "Only if you've got gills."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Fair enough."}]}]}, {"id": "guard:writer-a:1", "title": "Cargo only", "author": "writer-a", "phase": "pre", "premise": "The guard has stood since dawn while the charter ship loads spice.", "lines": [{"speaker": "P", "text": "How do I book passage on that ship?"}, {"speaker": "N", "text": "You don't. Cargo only today."}, {"speaker": "P", "text": "And tomorrow?"}, {"speaker": "N", "text": "Cargo only tomorrow."}, {"speaker": "X", "text": "Dockers carry a spice crate past you."}, {"speaker": "N", "text": "The crates have permission. You don't."}], "options": [{"label": "Permission from who?", "lines": [{"speaker": "N", "text": "Someone with a desk. Not me."}]}, {"label": "Long shift?", "lines": [{"speaker": "N", "text": "Since dawn. Six hours yet."}, {"speaker": "P", "text": "Sounds grim."}, {"speaker": "N", "text": "It's the post I was given."}]}, {"label": "Nice armour.", "lines": [{"speaker": "N", "text": "It's issued."}, {"speaker": "N", "text": "The Kualti get the good stuff."}]}, {"label": "I'll try the pub, then.", "lines": [{"speaker": "N", "text": "Won't get you a ship."}, {"speaker": "P", "text": "No, but it's out of the sun."}, {"speaker": "N", "text": "Timoiva."}]}]}, {"id": "guard:writer-b:0", "title": "Standing Orders", "author": "writer-b", "phase": "pre", "premise": "The guard stands at the berth, arms crossed, watching the gangplank.", "lines": [{"speaker": "P", "text": "Any chance of a ship out of here?"}, {"speaker": "N", "text": "Not without leave. Orders from the top."}, {"speaker": "P", "text": "Whose orders exactly?"}, {"speaker": "N", "text": "My captain's. He won't vouch for you."}], "options": [{"label": "Who gives leave?", "lines": [{"speaker": "N", "text": "Not me. I just stand here."}]}, {"label": "I'll find my own way.", "lines": [{"speaker": "N", "text": "Fair enough."}]}, {"label": "Push past you, then?", "lines": [{"speaker": "N", "text": "Go on, try it."}, {"speaker": "X", "text": "He doesn't budge."}]}]}, {"id": "guard:writer-b:1", "title": "Nobody's Business", "author": "writer-b", "phase": "pre", "premise": "The guard eyes a rowdy crowd outside the Flaming Arrow, half-listening.", "lines": [{"speaker": "P", "text": "I need a boat off Varlamore."}, {"speaker": "N", "text": "So does half this dock, iknami."}, {"speaker": "P", "text": "So what's stopping me?"}, {"speaker": "N", "text": "No captain'll take an unproven stranger."}, {"speaker": "X", "text": "The guard watches the pub."}], "options": [{"label": "What counts as proven?", "lines": [{"speaker": "N", "text": "Don't ask me. Nobody tells me either."}]}, {"label": "Bribe you?", "lines": [{"speaker": "N", "text": "Try that and see what happens."}]}, {"label": "Forget it, I'll swim.", "lines": [{"speaker": "N", "text": "That's your business, not mine."}]}, {"label": "Charming as always.", "lines": [{"speaker": "N", "text": "I don't get paid to be charming."}]}]}, {"id": "guard:current-approved-by-you:1", "title": "Fine", "author": "current (approved by you)", "phase": "post", "premise": "The version you approved earlier: he notices the quiver.", "lines": [{"speaker": "P", "text": "Any ships sailing today?"}, {"speaker": "N", "text": "Not for you."}, {"speaker": "P", "text": "What if I'm a champion?"}, {"speaker": "X", "text": "The guard notices the quiver on your back."}, {"speaker": "N", "text": "Fine."}], "options": []}, {"id": "guard:reviewer:1", "title": "Still no", "author": "reviewer", "phase": "post", "premise": "The guard sees the quiver before the player has finished asking.", "lines": [{"speaker": "P", "text": "Can I get on a ship now?"}, {"speaker": "X", "text": "The guard looks at the quiver, then at you."}, {"speaker": "N", "text": "Huh."}, {"speaker": "P", "text": "Is that a yes?"}, {"speaker": "N", "text": "It's not a no. Registrar's inside."}], "options": [{"label": "Who's the registrar?", "lines": [{"speaker": "N", "text": "The one with the ledger."}]}, {"label": "Where inside?", "lines": [{"speaker": "N", "text": "Behind me. Look for the desk."}]}, {"label": "You could sound happier.", "lines": [{"speaker": "N", "text": "I could."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Don't come back."}, {"speaker": "P", "text": "Charming."}, {"speaker": "N", "text": "I try."}]}]}, {"id": "guard:writer-a:2", "title": "The quiver", "author": "writer-a", "phase": "post", "premise": "The guard sees Dizana's quiver on the player's back before they've finished the question.", "lines": [{"speaker": "P", "text": "I want to sail out. Am I allowed now?"}, {"speaker": "X", "text": "The guard looks at the quiver on your back."}, {"speaker": "N", "text": "You're the one from the Colosseum."}, {"speaker": "P", "text": "That's me."}, {"speaker": "N", "text": "Then stopping you isn't my order."}, {"speaker": "N", "text": "Registrar's desk. Inside, behind me."}], "options": [{"label": "Where's the desk?", "lines": [{"speaker": "N", "text": "In the dock building. Can't miss it."}, {"speaker": "N", "text": "Ask for the harbour ledger."}]}, {"label": "Will they let me through?", "lines": [{"speaker": "N", "text": "The ledger decides. Not me."}, {"speaker": "N", "text": "Ask them nicely."}]}, {"label": "Did you see the Colosseum?", "lines": [{"speaker": "N", "text": "I've never had leave for it."}, {"speaker": "P", "text": "You should ask."}, {"speaker": "N", "text": "I'll stand here instead."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Go on, iknami."}]}]}, {"id": "guard:writer-b:2", "title": "Proof at Last", "author": "writer-b", "phase": "post", "premise": "The guard clocks the quiver on the player's back and straightens up.", "lines": [{"speaker": "P", "text": "I'm back. Which ship can I take?"}, {"speaker": "N", "text": "That's Dizana's quiver on your back."}, {"speaker": "X", "text": "The guard looks you over, then nods."}, {"speaker": "N", "text": "Talk to the registrar. Inside, past the ledger desk."}], "options": [{"label": "Where's the registrar?", "lines": [{"speaker": "N", "text": "Dock building behind me. Ledger desk."}]}, {"label": "Cheers.", "lines": [{"speaker": "N", "text": "Timoiva. Go on, then."}]}, {"label": "Took me long enough.", "lines": [{"speaker": "N", "text": "Fair enough. You got here."}]}]}]}, {"id": "dockworker", "name": "Dockworker", "dock": "Fortis Cothon", "display": "Dockworker", "brief": "Loads and unloads charter cargo at the Cothon. Knows the tide table, which crews tip, what the spice merchants pay, and where the Flaming Arrow keeps the good barrel. Bad back. Thinks the guards are decorative.", "place": "Fortis Cothon: the capital's big Roman-style harbour. Spice and fur stalls, tar and brine, a blacksmith's hammer, bread from the bakers, the Flaming Arrow pub getting loud. Knights and guards about; Shipwright Sennia and the charter crews at the dock building.", "models": "Worker (Varlamore) / Sailor (Varlamore) NPC models", "variants": [{"id": "dockworker:reviewer:0", "title": "Losing Count", "author": "reviewer", "phase": "pre", "premise": "He's tallying spice sacks off a charter ship and keeps losing his place.", "lines": [{"speaker": "P", "text": "Can you get me on a ship out of here?"}, {"speaker": "N", "text": "Nilsal. You've made me lose count."}, {"speaker": "X", "text": "He starts again at the first sack."}, {"speaker": "N", "text": "Crews won't take a stranger. Ask them yourself."}, {"speaker": "P", "text": "Why wouldn't they?"}, {"speaker": "N", "text": "Nobody's vouched for you. That's the whole of it."}], "options": [{"label": "Who'd have to vouch for me?", "lines": [{"speaker": "N", "text": "Someone with a ledger and a worse temper."}, {"speaker": "N", "text": "Not me. I lift things."}]}, {"label": "What's in the sacks?", "lines": [{"speaker": "N", "text": "Spice. Worth more than me, sack for sack."}, {"speaker": "N", "text": "Don't touch it. They count it twice."}]}, {"label": "The guards could help.", "lines": [{"speaker": "N", "text": "Those two? They're for looking at."}, {"speaker": "P", "text": "They're armed."}, {"speaker": "N", "text": "So's the blacksmith."}]}, {"label": "I'll leave you to it.", "lines": [{"speaker": "N", "text": "Timoiva. Sixty-one, sixty-two..."}]}]}, {"id": "dockworker:writer-a:0", "title": "Bad Back Day", "author": "writer-a", "phase": "pre", "premise": "The dockworker is trying to shift a crate of nails off his shoulder and failing.", "lines": [{"speaker": "P", "text": "Can you get me onto a ship out of here?"}, {"speaker": "N", "text": "Nilsal! Help me with this crate first."}, {"speaker": "X", "text": "You take one end. It is full of nails."}, {"speaker": "N", "text": "There. My back's gone again."}, {"speaker": "N", "text": "Ships? Nobody's sailing you anywhere."}], "options": [{"label": "Who decides who sails?", "lines": [{"speaker": "N", "text": "Someone in the dock building with a ledger."}, {"speaker": "N", "text": "I've never been past that door."}]}, {"label": "Your back sounds bad.", "lines": [{"speaker": "N", "text": "Twelve years of hauling crates. Worth it for the pay."}, {"speaker": "P", "text": "Is the pay good?"}, {"speaker": "N", "text": "Not really, no."}]}, {"label": "What's in the crates?", "lines": [{"speaker": "N", "text": "Spice mostly. Furs when the northern lot come in."}, {"speaker": "N", "text": "Don't touch the spice. They count it."}]}, {"label": "I'll leave you to it.", "lines": [{"speaker": "N", "text": "Timoiva. Send the cart lad over if you see him."}]}]}, {"id": "dockworker:writer-a:1", "title": "Tide Going Out", "author": "writer-a", "phase": "pre", "premise": "The dockworker is tallying spice sacks from a bollard, bread in hand, losing count.", "lines": [{"speaker": "P", "text": "I need a boat out of Varlamore."}, {"speaker": "N", "text": "Tide's going out. So's my lunch break."}, {"speaker": "N", "text": "Even if a crew wanted you, they can't take you."}, {"speaker": "P", "text": "Says who, exactly?"}, {"speaker": "N", "text": "The desk inside. The guards just stand about looking smart."}], "options": [{"label": "Which crews might take me?", "lines": [{"speaker": "N", "text": "The Aldarin run tips well. The spice lot never tip."}, {"speaker": "N", "text": "Neither will sail you out, mind."}]}, {"label": "What's this desk inside?", "lines": [{"speaker": "N", "text": "A ledger. Every hull in the harbour's written in it."}, {"speaker": "N", "text": "Don't go bothering it without a reason."}]}, {"label": "Where can I get a drink?", "lines": [{"speaker": "N", "text": "Flaming Arrow. Ask for the sunbeam ale."}, {"speaker": "P", "text": "Is it any good?"}, {"speaker": "N", "text": "You'll thank me."}]}, {"label": "Enjoy your bread.", "lines": [{"speaker": "N", "text": "I will. Tide's back in an hour anyway."}]}]}, {"id": "dockworker:writer-b:0", "title": "Aching Back", "author": "writer-b", "phase": "pre", "premise": "He's hunched over a heavy crate, easing it down onto the dock.", "lines": [{"speaker": "P", "text": "Any ships heading out of the harbour?"}, {"speaker": "N", "text": "Ask the tide, not me, iknami."}, {"speaker": "X", "text": "He straightens up slowly, hand pressed to his back."}, {"speaker": "N", "text": "They'll sail all right. Just not with you aboard."}, {"speaker": "P", "text": "Says who?"}, {"speaker": "N", "text": "No idea. Above my pay, and my pay's already rubbish."}], "options": [{"label": "Why won't they take me?", "lines": [{"speaker": "N", "text": "You'd have to prove yourself first. No idea how."}]}, {"label": "Rough day?", "lines": [{"speaker": "N", "text": "Every day's rough when you lift crates for a living."}, {"speaker": "P", "text": "Suppose so."}, {"speaker": "N", "text": "Mind how you go."}]}, {"label": "Never mind.", "lines": [{"speaker": "N", "text": "Wise choice."}]}]}, {"id": "dockworker:writer-b:1", "title": "Counting Coins", "author": "writer-b", "phase": "pre", "premise": "He's counting coins a ship's crew just paid him for unloading cargo.", "lines": [{"speaker": "P", "text": "Can I catch a ride out of Varlamore?"}, {"speaker": "N", "text": "Ha. Wish I could tell you yes."}, {"speaker": "X", "text": "He pockets the coins and nods towards the mo
