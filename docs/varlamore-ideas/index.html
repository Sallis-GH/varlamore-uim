e-and-anvil setups at Tal Teklan, Cam Torum, Auburnvale, Mistrock and Sunset Coast. Combat: Fortis Colosseum. Crucially the panel should also say where Varlamore is thin &mdash; Runecraft has no confirmed altar or essence source, and Construction has no in-region house &mdash; both marked <b>unverified<\/b> as true negatives and worth a follow-up check.<\/p><p><b>Detection:<\/b> none required beyond reading current levels to sort rows into \"available now\", \"soon\" and \"locked\".<\/p><p><b>Why it fits:<\/b> it replaces the constant alt-tab to a wiki that is organised by skill, not by region.<\/p><p><b>Feasibility:<\/b> easy. A static data table plus level reads; the maintenance cost is keeping it current with game updates.<\/p><p><b>Challenge:<\/b> The rows that are cited hold up — Fletching via Vale Totems, Prayer via the libation bowl, the Stonecutter Outpost ore levels, Thieving 50. The rows that are not cited are the problem: Agility is missing entirely despite the Colossal Wyrm Agility Course being the region's flagship Agility content, Fishing, Crafting and Slayer have no rows, and the Runecraft and Construction \"no answer\" verdicts are inferences rather than confirmed negatives. As written this is the one item in the document that reads as a wiki page pasted into the client; narrow it to the four skills the lock genuinely constrains.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Varlamore\">Wiki: Varlamore<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Stonecutter_Outpost\">Wiki: Stonecutter Outpost<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Vale_Totems_(minigame)\">Wiki: Vale Totems<\/a>"}, {"id": "rumour-tracker", "title": "Hunters' Rumours tracker", "summary": "Tier progress, lifetime rumour count, and countdowns to the three blueprint milestones.", "html": "<p>Rumours are the region's most repeatable content and the source of the whole whistle line. The tracker shows the current tier (Novice 46 from Huntmaster Gilman, Adept 57, Expert 72, Master 91 plus At First Light), the active assignment, lifetime completions with markers at 10, 100 and 250, and expected XP per hand-in using the documented formula of (Hunter level + 5) x 50 for Novice and Adept, x 55 for Expert, x 60 for Master. Loot-sack contents can be logged too, including guild hunter outfit pieces, the huntsman's kit and Quetzin.<\/p><p><b>Detection:<\/b> chat-message parsing on assignment and hand-in, plus the rumour interface widget where available; persist the counter in config.<\/p><p><b>Why it fits:<\/b> the game itself gives no visible lifetime rumour counter, and three separate rewards hang off that number.<\/p><p><b>Feasibility:<\/b> easy to medium. Chat parsing is fragile against wording changes, so pair it with a manual correction field in the panel.<\/p><p><b>Challenge:<\/b> Tiers, blueprint milestones and the (Hunter+5)×50/55/60 formula are all verified correct — and all already shipped by the Hunter Rumours plugin on the Plugin Hub. Two plugins parsing the same chat messages is the kind of overlap a Hub reviewer rejects on principle. Keep only the lifetime counter feeding the whistle milestone.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Hunters%27_Rumours\">Wiki: Hunters' Rumours<\/a>"}, {"id": "shop-router", "title": "Single-source shop router", "summary": "Type an item, get the nearest Varlamore vendor, the walking route, and a warning if it is the only one.", "html": "<p>A searchable index of every Varlamore shop and its stock, built from the shop survey: seven general stores, two rune shops, two fishing shops, two gem shops, four smithing and armour shops, plus the specialists. Searching \"secateurs\" returns Kastori Farming Supplies with a SINGLE-SOURCE badge; searching \"chisel\" returns nine options sorted by distance. Items with no Varlamore source return an explicit \"not obtainable in region\" result rather than nothing.<\/p><p><b>Detection:<\/b> none &mdash; it is a static lookup keyed on item ID and name, with distance computed from the player's current <code>WorldPoint<\/code>.<\/p><p><b>Why it fits:<\/b> for a no-trade account, \"which shop\" is the only supply question there is, and the single-source badges double as loss-prevention.<\/p><p><b>Feasibility:<\/b> easy, but data-heavy. The stock tables need a maintenance plan, and several food and cosmetic stalls were not stock-listed in the research pass and are marked <b>unverified<\/b>.<\/p><p><b>Challenge:<\/b> The concept is sound and the single-source badges are the loss-prevention feature the whole key-items section is built on. The data is the liability: this pass found the law-rune entry to be wrong, several stalls unpriced, and no owner for keeping the tables current across game updates. Ship the badges for the dozen items that matter and drop the general search index, or the first shop rework will silently make the plugin lie.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Civitas_illa_Fortis\">Wiki: Civitas illa Fortis<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Kastori_Farming_Supplies\">Wiki: Kastori Farming Supplies<\/a>"}, {"id": "quest-boundary-planner", "title": "Quest boundary planner", "summary": "Flags which Varlamore quests actually leave the region and which need prerequisites done before the lock arms.", "html": "<p>Not every \"Varlamore quest\" stays in Varlamore. Children of the Sun is entirely in Varrock. Twilight's Promise returns to Varrock's east gate. Ethically Acquired Antiquities travels to Port Sarim and the Varrock Museum and needs Shield of Arrav. At First Light needs Eagles' Peak as a prerequisite, but the quest itself is now confirmed to stay inside Varlamore (Civitas illa Fortis, Avium Savannah, Locus Oasis) &mdash; green badge, red prerequisite. Shadows of Custodia investigates caves and trails outside Auburnvale and is likewise <b>unverified<\/b>. The planner shows each quest with a green/amber/red boundary badge, its non-boostable skill requirements against current levels, and a pre-lock checklist of the outside prerequisites.<\/p><p><b>Detection:<\/b> quest states and skill levels, rendered against a static table of boundary verdicts.<\/p><p><b>Why it fits:<\/b> the worst outcome for a locked run is discovering mid-quest that step four is in Varrock. This is the feature that prevents that.<\/p><p><b>Feasibility:<\/b> easy. The hard part is research, not code &mdash; the amber entries need in-game verification before the badges can be trusted.<\/p><p><b>Challenge:<\/b> One amber entry resolves to green: the <a href=\"https://oldschool.runescape.wiki/w/At_First_Light\">At First Light<\/a> page confirms the quest never leaves Varlamore, so only its Eagles' Peak prerequisite is a boundary problem. That distinction is worth building into the badge itself &mdash; \"quest in region, prerequisite outside\" is a different and far more common state than \"quest leaves the region\", and it is the state a pre-lock checklist actually acts on. Shadows of Custodia remains genuinely unverified.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Ethically_Acquired_Antiquities\">Wiki: Ethically Acquired Antiquities<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/At_First_Light\">Wiki: At First Light<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Shadows_of_Custodia\">Wiki: Shadows of Custodia<\/a>"}, {"id": "standin-dialogue-codex", "title": "Stand-in NPC dialogue codex", "summary": "A collectible log of what the replacement dock crews say, keyed to the player's progress.", "html": "<p>The plugin already replaces the Trader Crewmembers at Sunset Coast, Aldarin and Fortis Cothon with talking stand-ins. Rather than one refusal line repeated forever, give each dock a small script that changes with progress &mdash; dismissive before the first quetzal whistle, curious after Perilous Moons, respectful after Dizana's quiver when the in-region routes open. A codex page in the panel logs each line the first time it is heard, giving the stand-ins the feel of characters rather than error messages. Varlamore's own setting supports it: the three docks sit in a society with named settlements, factions and a Nahuatl-inspired vocabulary the lines can draw on.<\/p><p><b>Detection:<\/b> milestone state the plugin already tracks selects which line to show; a seen-lines set persists in config.<\/p><p><b>Why it fits:<\/b> it turns the plugin's central restriction into the plugin's central piece of flavour, and rewards progress with something no other tracker offers.<\/p><p><b>Feasibility:<\/b> easy. Client-side dialogue text on a replaced NPC is already implemented; this only adds branching and a log.<\/p><p><b>Challenge:<\/b> No factual issues, and the scaffolding is already in the repo. The one design caution: milestone-branching dialogue means the codex is only as good as the milestone tracker underneath it, so the branch points should key off the few milestones that are cheap and certain to detect — quest states and item IDs — rather than the ones resting on unconfirmed varbits.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Charter_ship\">Wiki: Charter ship<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Varlamore\">Wiki: Varlamore<\/a>"}, {"id": "x-fairy-ring-lockdown", "title": "Fairy ring lockdown (AIS, AJP, CKQ)", "summary": "Three fairy rings sit inside Varlamore and nothing in the plugin currently touches them.", "html": "<p>This is not a feature so much as a hole. Varlamore contains three fairy rings &mdash; <b>AIS<\/b> in Auburn Valley, <b>AJP<\/b> in the Avium Savannah beside the Colossal Wyrm Remains, and <b>CKQ<\/b> in Aldarin &mdash; and the quest that unlocks them is Children of the Sun, the exact quest this plugin treats as the moment the lock arms. The existing blockers cover spells, jewellery, tablets, quest items, the minigame grouping tab and the charter crews, and then leave the player standing next to a device that reaches every corner of Gielinor in four clicks and costs nothing. Any account running this challenge can currently walk out of the region by accident.<\/p><p><b>Detection:<\/b> intercept <code>MenuOptionClicked<\/code> on the fairy ring object. Consume <i>Ring-last-destination<\/i> whenever the stored last-destination is not one of the three in-region codes, and consume the travel click on the fairy ring code interface once the three dials resolve to a code outside the allowlist. Both are ordinary client-side menu consumption &mdash; the server never receives the click, which is exactly how <code>SpellTeleportBlocker<\/code> and <code>ItemTeleportBlocker<\/code> already work.<\/p><p><b>Why it fits:<\/b> the plugin's one job is deciding which travel is legal. A travel network it has never heard of is the only kind of bug that invalidates a whole run.<\/p><p><b>Feasibility:<\/b> easy, and it should be treated as a defect fix rather than a new feature. The three codes become an allowlist beside the region set; travel between them is internal Varlamore transport and stays legal.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fairy_ring\">Wiki: Fairy ring<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Children_of_the_Sun\">Wiki: Children of the Sun<\/a>"}]}]}}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'vuim-ideas-scores-v1';
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { store = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} updateProgress(); }
  const scoreIds = [];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function scoreBox(id, label){
    scoreIds.push(id);
    const v = store[id] && store[id].score != null ? store[id].score : '';
    const hasNote = !!(store[id] && store[id].note);
    return `<div class="score" title="${esc(label||'')}"><input type="number" min="1" max="100" placeholder="1-100" data-score="${esc(id)}" value="${esc(v)}" aria-label="Score for ${esc(label||id)}"><button type="button" class="notebtn ${hasNote?'has':''}" data-notebtn="${esc(id)}" title="Add a note">&#9998; note</button></div>`;
  }
  function noteBox(id){
    const v = store[id] && store[id].note ? store[id].note : '';
    return `<textarea class="note ${v?'':'hidden'}" placeholder="Note (optional)" data-note="${esc(id)}">${esc(v)}</textarea>`;
  }
  function lineRow(id, speaker, text, npcName){
    const cls = speaker === 'P' ? 'player' : speaker === 'X' ? 'narr' : 'npc';
    const who = speaker === 'P' ? 'Player' : speaker === 'X' ? '' : (npcName || 'NPC');
    return `<div class="row"><div class="who ${cls}">${esc(who)}</div><div class="bubble ${cls}">${esc(text)}</div>${scoreBox(id, text)}${noteBox(id)}</div>`;
  }
  function conversation(vid, v, npcName){
    let h = '<div class="convo">';
    (v.lines || []).forEach((l, i) => { h += lineRow(`${vid}:l${i}`, l.speaker, l.text, npcName); });
    if (v.options && v.options.length){
      h += `<div class="options"><div class="title">Select an option</div>`;
      v.options.forEach((o, i) => {
        h += `<div class="option"><div class="row"><div class="num">${i+1}.</div><div class="bubble option">${esc(o.label)}</div>${scoreBox(`${vid}:o${i}`, o.label)}${noteBox(`${vid}:o${i}`)}</div><div class="ending convo">`;
        (o.lines || []).forEach((l, j) => { h += lineRow(`${vid}:o${i}l${j}`, l.speaker, l.text, npcName); });
        h += `</div></div>`;
      });
      h += `</div>`;
    }
    h += '</div>';
    return h;
  }
  function overallRow(id, label){
    return `<div class="row" style="margin-top:12px"><div class="who" style="font-weight:600;color:var(--ink)">Overall</div><div class="bubble" style="background:#fff">${esc(label)}</div>${scoreBox(id, label)}${noteBox(id)}</div>`;
  }

  // ---------- render ----------
  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  let navHtml = `<h1>${esc(DATA.meta.title)}</h1><div class="sub">${esc(DATA.meta.subtitle)}</div>`;
  let html = '';

  // Overview
  html += `<section id="overview"><h2>${esc(DATA.overview.title)}</h2><p class="lead">${esc(DATA.overview.lead)}</p>`;
  DATA.overview.blocks.forEach(b => { html += `<div class="card"><h3 style="margin-top:0">${esc(b.title)}</h3>${b.html}</div>`; });
  html += `</section>`;
  navHtml += `<a class="sec" href="#overview">Overview</a>`;

  // Unlock design
  const U = DATA.unlock;
  html += `<section id="unlock"><h2>${esc(U.title)}</h2><p class="lead">${esc(U.lead)}</p>${U.intro_html || ''}`;
  U.candidates.forEach((c, i) => {
    const cid = `unlock:${c.id}`;
    html += `<div class="card" id="${esc(cid)}"><h3 style="margin-top:0">${esc(c.name)} <span class="pill type">${esc(c.type)}</span></h3>
      <div class="kv"><b>Where</b><span>${esc(c.location)}</span><b>Why it fits</b><span>${esc(c.why)}</span><b>Pros</b><span>${esc(c.pros)}</span><b>Cons</b><span>${esc(c.cons)}</span><b>Source</b><span>${c.source_html || ''}</span></div>`;
    if (c.script){ html += `<h4>With the quiver</h4>` + conversation(cid + ':with', c.script, c.name.replace(/ \(.*\)$/, '')); }
    if (c.script_without){ html += `<h4>Without the quiver</h4>` + conversation(cid + ':without', c.script_without, c.name.replace(/ \(.*\)$/, '')); }
    html += overallRow(`${cid}:overall`, `Overall: ${c.name} as the unlocker`);
    html += `</div>`;
  });
  html += U.also_considered_html || '';
  html += `</section>`;
  navHtml += `<a class="sec" href="#unlock">Unlock design</a>`;
  U.candidates.forEach(c => { navHtml += `<a class="sub-link" href="#unlock:${esc(c.id)}">${esc(c.name)}</a>`; });

  // Characters
  html += `<section id="characters"><h2>${esc(DATA.characters_title)}</h2><p class="lead">${esc(DATA.characters_lead)}</p>`;
  navHtml += `<a class="sec" href="#characters">Characters</a>`;
  DATA.characters.forEach(ch => {
    const secId = `char:${ch.id}`;
    navHtml += `<a class="sub-link" href="#${esc(secId)}">${esc(ch.name)}</a>`;
    html += `<div id="${esc(secId)}" style="scroll-margin-top:16px"><h3>${esc(ch.name)} <span class="pill">${esc(ch.dock)}</span></h3>
      <div class="brief"><b>Who they are.</b> ${esc(ch.brief)}<br><span class="meta">Writers were given only this brief, the location, and the one lore rule.</span></div>`;
    const pre = ch.variants.filter(v => v.phase === 'pre'), post = ch.variants.filter(v => v.phase === 'post');
    const groups = [['Before the quiver', pre, 'pre'], ['After the quiver', post, 'post']];
    groups.forEach(([label, vs, phase]) => {
      if (!vs.length) return;
      html += `<h4>${esc(label)}</h4><div class="tabs" data-tabs="${esc(secId)}:${phase}">`;
      vs.forEach((v, i) => { html += `<button data-tab="${esc(v.id)}" class="${i===0?'active':''}">${esc(v.title)} <span class="meta">(${esc(v.author)})</span></button>`; });
      html += `</div>`;
      vs.forEach((v, i) => {
        html += `<div class="card tab-panel ${i===0?'':'hidden'}" data-panel="${esc(v.id)}" data-group="${esc(secId)}:${phase}">
          <div class="meta"><span class="pill ${phase}">${phase === 'pre' ? 'before quiver' : 'after quiver'}</span>${v.premise ? esc(v.premise) : ''}</div>`;
        html += conversation(v.id, v, ch.display || ch.name);
        html += overallRow(`${v.id}:overall`, `Overall: "${v.title}" for ${ch.name}`);
        html += `</div>`;
      });
    });
    html += `<div class="card tight">` + overallRow(`char:${ch.id}:concept`, `The character itself: does a ${ch.name.toLowerCase()} belong at ${ch.dock}?`) + `</div>`;
    html += `</div>`;
  });
  html += `</section>`;

  // Plugin ideas
  DATA.plugin.sections.forEach(sec => {
    const sid = `plugin:${sec.id}`;
    navHtml += `<a class="sec" href="#${esc(sid)}">${esc(sec.title)}</a>`;
    html += `<section id="${esc(sid)}"><h2>${esc(sec.title)}</h2><p class="lead">${esc(sec.lead)}</p>${sec.intro_html || ''}`;
    sec.items.forEach(it => {
      const iid = `${sid}:${it.id}`;
      html += `<div class="card tight"><div class="idea"><div><h5>${esc(it.title)}</h5><div class="details">${it.html || esc(it.summary)}</div>${it.source_html ? `<div class="src">${it.source_html}</div>` : ''}</div>${scoreBox(iid, it.title)}</div>${noteBox(iid)}</div>`;
    });
    html += `</section>`;
  });

  // Export
  html += `<section id="export" class="export"><h2>Your scores</h2><p class="lead">Scores save automatically in this browser. When you're done, copy the text below and paste it back to me.</p>
    <button class="btn" id="copy">Copy scores</button><button class="btn secondary" id="refresh">Refresh text</button><button class="btn secondary" id="clear">Clear all scores</button>
    <div style="margin-top:10px"><textarea id="exportbox" readonly></textarea></div></section>`;
  navHtml += `<a class="sec" href="#export">Your scores</a><div class="progress"><span id="prog-text"></span><div class="bar"><i id="prog-bar"></i></div></div>`;

  main.innerHTML = html;
  nav.innerHTML = navHtml;

  // ---------- behaviour ----------
  function paintInput(inp){
    const v = parseInt(inp.value, 10);
    inp.classList.toggle('filled', !isNaN(v));
    inp.classList.toggle('low', !isNaN(v) && v <= 30);
    inp.classList.toggle('high', !isNaN(v) && v >= 70);
  }
  main.querySelectorAll('input[data-score]').forEach(inp => {
    paintInput(inp);
    inp.addEventListener('input', () => {
      let v = parseInt(inp.value, 10);
      if (!isNaN(v)) { v = Math.max(1, Math.min(100, v)); }
      const id = inp.dataset.score;
      store[id] = store[id] || {};
      if (isNaN(v)) delete store[id].score; else store[id].score = v;
      paintInput(inp); save();
    });
  });
  main.querySelectorAll('button[data-notebtn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = main.querySelector(`textarea[data-note="${CSS.escape(btn.dataset.notebtn)}"]`);
      if (!ta) return;
      ta.classList.toggle('hidden');
      if (!ta.classList.contains('hidden')) ta.focus();
    });
  });
  main.querySelectorAll('textarea[data-note]').forEach(ta => {
    ta.addEventListener('input', () => {
      const id = ta.dataset.note; store[id] = store[id] || {};
      if (ta.value.trim()) store[id].note = ta.value; else delete store[id].note;
      const b = main.querySelector(`button[data-notebtn="${CSS.escape(id)}"]`);
      if (b) b.classList.toggle('has', !!store[id].note);
      save();
    });
  });
  main.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.parentElement.dataset.tabs;
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      main.querySelectorAll(`.tab-panel[data-group="${group}"]`).forEach(p => p.classList.toggle('hidden', p.dataset.panel !== btn.dataset.tab));
    });
  });
  function updateProgress(){
    const done = scoreIds.filter(id => store[id] && store[id].score != null).length;
    document.getElementById('prog-text').textContent = `${done} / ${scoreIds.length} scored`;
    document.getElementById('prog-bar').style.width = (scoreIds.length ? (100*done/scoreIds.length) : 0) + '%';
  }
  function labelFor(id){
    const el = main.querySelector(`input[data-score="${CSS.escape(id)}"]`);
    return el ? (el.closest('.row, .idea') ? (el.closest('.row, .idea').querySelector('.bubble, h5') || {}).textContent || id : id) : id;
  }
  function exportText(){
    const lines = [`# Varlamore UIM ideas — scores (${new Date().toISOString().slice(0,10)})`, ''];
    const ids = Object.keys(store).filter(k => store[k] && (store[k].score != null || store[k].note));
    ids.sort();
    ids.forEach(id => {
      const s = store[id];
      lines.push(`${id} | ${s.score != null ? s.score : '-'} | ${labelFor(id).trim()}${s.note ? ' | NOTE: ' + s.note.replace(/\s+/g,' ') : ''}`);
    });
    lines.push('', '```json', JSON.stringify(store), '```');
    return lines.join('\n');
  }
  function refreshExport(){ document.getElementById('exportbox').value = exportText(); }
  document.getElementById('copy').addEventListener('click', async () => {
    refreshExport();
    const t = document.getElementById('exportbox');
    try { await navigator.clipboard.writeText(t.value); toast('Copied to clipboard'); }
    catch (e) { t.select(); document.execCommand('copy'); toast('Copied'); }
  });
  document.getElementById('refresh').addEventListener('click', () => { refreshExport(); toast('Refreshed'); });
  document.getElementById('clear').addEventListener('click', () => {
    if (!window.confirm('Clear every score and note?')) return;
    store = {}; save();
    main.querySelectorAll('input[data-score]').forEach(i => { i.value = ''; paintInput(i); });
    main.querySelectorAll('textarea[data-note]').forEach(t => { t.value = ''; });
    refreshExport();
  });
  let toastTimer;
  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600); }
  // active nav on scroll
  const secs = Array.from(document.querySelectorAll('main section, main [id^="char:"]'));
  const links = Array.from(nav.querySelectorAll('a[href^="#"]'));
  function onScroll(){
    let cur = null;
    secs.forEach(s => { if (s.getBoundingClientRect().top <= 80) cur = s.id; });
    links.forEach(a => a.classList.toggle('active', cur && a.getAttribute('href') === '#' + cur));
  }
  window.addEventListener('scroll', onScroll, {passive:true}); onScroll();
  updateProgress(); refreshExport();
})();
</script>
</body>
</html>
