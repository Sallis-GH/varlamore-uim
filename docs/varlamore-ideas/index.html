ored ships."}, {"speaker": "N", "text": "The Aldarin crews tip well. The rest never do."}, {"speaker": "P", "text": "But can any of them sail me out?"}, {"speaker": "N", "text": "Not one. None of them will vouch for a stranger."}], "options": [{"label": "Who would vouch for me?", "lines": [{"speaker": "N", "text": "Some registrar up in the dock building. Never met her."}]}, {"label": "Any good crews to work for?", "lines": [{"speaker": "N", "text": "The Aldarin lot, if you don't mind heavy lifting."}, {"speaker": "P", "text": "Noted."}, {"speaker": "N", "text": "Timoiva."}]}, {"label": "Forget it.", "lines": [{"speaker": "N", "text": "Suit yourself."}]}]}, {"id": "dockworker:reviewer:1", "title": "He Puts It Down", "author": "reviewer", "phase": "post", "premise": "He's dragging a coil of rope along the wharf and stops when he sees the quiver.", "lines": [{"speaker": "P", "text": "Any chance of a ship out of Varlamore?"}, {"speaker": "X", "text": "He puts the rope down and looks at the quiver."}, {"speaker": "N", "text": "Tetamo. You don't see those on the wharf."}, {"speaker": "P", "text": "It's from the Colosseum."}, {"speaker": "N", "text": "I know what it is. Go and see the registrar."}], "options": [{"label": "Where do I find her?", "lines": [{"speaker": "N", "text": "Up the wharf. She's the one with the ledger."}]}, {"label": "Will that be enough?", "lines": [{"speaker": "N", "text": "It's more than anyone here has. Try it."}]}, {"label": "You could vouch for me.", "lines": [{"speaker": "N", "text": "Me? I dropped a crate last week."}, {"speaker": "P", "text": "Fair enough."}, {"speaker": "N", "text": "Go on. She doesn't wait about."}]}, {"label": "Thanks.", "lines": [{"speaker": "N", "text": "Timoiva. Mind the ropes."}]}]}, {"id": "dockworker:writer-a:2", "title": "He Sees It", "author": "writer-a", "phase": "post", "premise": "The dockworker is coiling rope and stops dead when he sees the quiver.", "lines": [{"speaker": "P", "text": "Any chance of a ship out of the kingdom?"}, {"speaker": "X", "text": "He looks at the quiver on your back and drops the rope."}, {"speaker": "N", "text": "Tetamo. You don't see those down here."}, {"speaker": "P", "text": "I earned it at the Colosseum."}, {"speaker": "N", "text": "Then stop asking dockhands. Go and see the registrar."}], "options": [{"label": "Where's the registrar?", "lines": [{"speaker": "N", "text": "Dock building, desk at the back. You'll see the ledger."}]}, {"label": "You know what this is?", "lines": [{"speaker": "N", "text": "Everyone here knows. The betting lot talk of nothing else."}, {"speaker": "N", "text": "Loudest thing in the capital."}]}, {"label": "Will the crews take me?", "lines": [{"speaker": "N", "text": "They take whoever the ledger says. Get your name in it."}, {"speaker": "N", "text": "Then find a crew. The Aldarin lot are decent."}]}, {"label": "Thanks. I'll go now.", "lines": [{"speaker": "N", "text": "Timoiva. Mind the wet steps on your way in."}]}]}, {"id": "dockworker:writer-b:2", "title": "Quiver Spotted", "author": "writer-b", "phase": "post", "premise": "He's stacking barrels by the charter dock, checking the tide table.", "lines": [{"speaker": "P", "text": "I need a ship out of Varlamore."}, {"speaker": "X", "text": "He spots Dizana's quiver and stops mid-lift."}, {"speaker": "N", "text": "Tetamo... that's a Colosseum quiver, that is."}, {"speaker": "P", "text": "Does that mean something?"}, {"speaker": "N", "text": "Means you've earned your ticket. Go find the registrar."}, {"speaker": "N", "text": "She keeps the ledger. Ask her, not me."}], "options": [{"label": "Where's the dock building?", "lines": [{"speaker": "N", "text": "Right there, past the crates. Can't miss it."}]}, {"label": "Thanks for the tip.", "lines": [{"speaker": "N", "text": "Don't thank me, thank your own arms."}, {"speaker": "P", "text": "Ha."}, {"speaker": "N", "text": "Go on, then."}]}, {"label": "One more question.", "lines": [{"speaker": "N", "text": "Make it quick, I've crates waiting."}, {"speaker": "P", "text": "Never mind."}, {"speaker": "N", "text": "Timoiva, then."}]}]}]}], "plugin": {"sections": [{"id": "progress", "title": "Progress tracking", "lead": "A thirteen-step ladder from a fresh Varlamore-locked account to Doom of Mokhaiotl, where every rung is something the client can actually observe.", "intro_html": "<p>A Varlamore-locked Ultimate Ironman has no bank, no trades and no way out of the region, so the only sense of forward motion comes from unlocks the region itself grants. These twelve milestones are ordered the way a fresh account would meet them: tools, the first quests that never leave the region, the Hunter Guild, the quetzal network, then bosses and the Colosseum ladder.<\/p><p>Every milestone below names a concrete detection route the RuneLite client already supports &mdash; a quest state, a varbit, a skill level, an item in inventory or equipment, or a chat message. Nothing here asks the plugin to do anything the server would have to authorise.<\/p>", "items": [{"id": "children-of-the-sun", "title": "Children of the Sun (the pre-lock exception)", "summary": "The one quest that must happen outside Varlamore, and the moment the lock should switch on.", "html": "<p>Children of the Sun is the quest that grants Quetzal Transport System access and fairy-ring travel to Varlamore &mdash; but it starts in Varrock Square and plays out entirely in Varrock. A strictly Varlamore-locked account therefore cannot self-unlock the region. Treat it as a carve-out done before the lock arms, in the same spirit as the Druidic Ritual exception area-locked accounts already make, and have the panel show <i>Lock armed<\/i> only once it is complete.<\/p><p><b>Trigger / detection:<\/b> read the quest state via the client's quest API (<code>Quest.CHILDREN_OF_THE_SUN.getState(client)<\/code>) or its progress varbit on login and on <code>VarbitChanged<\/code>. On the transition to <code>FINISHED<\/code>, flip the panel banner from \"Pre-lock setup\" to \"Varlamore Lock Active\" and start the boundary checker.<\/p><p><b>Why it fits:<\/b> it is the literal entry point to the challenge, and making the plugin state the exception out loud is more honest than silently letting the player wander to Varrock.<\/p><p><b>Feasibility:<\/b> easy. Quest state and varbit reads are standard; the only design decision is whether the boundary checker stays dormant or whitelists Varrock for the quest's duration.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Children_of_the_Sun\">Wiki: Children of the Sun<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Snowflake_account\">Wiki: Snowflake accounts (area-locked)<\/a>"}, {"id": "starter-toolkit", "title": "First toolkit assembled", "summary": "Knife, tinderbox, hammer, chisel, needle and thread &mdash; the six cheap tools every later milestone quietly assumes.", "html": "<p>Seven general stores across the region (Fortis, Aldarin, Cam Torum, Kastori, Sunset Coast, Tal Teklan, Auburnvale) stock the same basic tool set. For a UIM with no bank, \"owning\" a tool means carrying it, so the first milestone is simply having held each one at least once. The knife matters most: it is required to carve the basic quetzal whistle later.<\/p><p><b>Trigger / detection:<\/b> scan inventory and equipment on <code>ItemContainerChanged<\/code> for each item ID; tick a per-item checkbox in config the first time each is seen. No timer, no polling.<\/p><p><b>Why it fits:<\/b> it turns the very first shopping trip into a visible achievement and teaches the player which shops exist before anything is gated behind them.<\/p><p><b>Feasibility:<\/b> easy. This is the same inventory-scan pattern the existing item blocker already uses to match item IDs.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_General_Store\">Wiki: Fortis General Store<\/a>"}, {"id": "native-quest-sweep", "title": "The three no-leave starter quests", "summary": "Scrambled!, Meat and Greet and The Ribbiting Tale of a Lily Pad Labour Dispute all begin and end inside Varlamore.", "html": "<p>These three are the only low-requirement quests confirmed to run entirely inside the region. Scrambled! (Construction 38, Cooking 36, Smithing 35) starts at the Temple of Tal Teok; Meat and Greet starts with Emelio in Outer Fortis and opens his kebab shop; The Ribbiting Tale (Woodcutting 15) starts with Marcellus at Locus Oasis and adds a hardwood Farming patch. Together they are the natural first questing sweep after the lock arms.<\/p><p><b>Trigger / detection:<\/b> three quest-state reads, rendered as a small three-of-three sub-progress bar. Fire a one-off chat message when the third completes.<\/p><p><b>Why it fits:<\/b> it gives an early quest goal that carries zero boundary risk, unlike Ethically Acquired Antiquities (travels to Port Sarim and Varrock Museum) or At First Light (needs Eagles' Peak first).<\/p><p><b>Feasibility:<\/b> easy. Quest states only; the skill requirements are non-boostable, so the panel can also show which of the three are currently reachable.<\/p><p><b>Challenge:<\/b> The three quests and their requirements check out. The framing does not quite: At First Light is now confirmed to stay inside Varlamore, so the reason to defer it is its Eagles' Peak prerequisite, not boundary risk. Scrambled! is also the quest that quietly demands a saw, and the only saw in the region is 13 gp in Auburnvale — worth surfacing in the same sub-bar.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Scrambled!\">Wiki: Scrambled!<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Meat_and_Greet\">Wiki: Meat and Greet<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/The_Ribbiting_Tale_of_a_Lily_Pad_Labour_Dispute\">Wiki: The Ribbiting Tale of a Lily Pad Labour Dispute<\/a>"}, {"id": "twilights-promise", "title": "Twilight's Promise &mdash; Renu and the first teleport spell", "summary": "The quest that gives the player their own quetzal and the Civitas illa Fortis Teleport spell.", "html": "<p>Twilight's Promise rewards the Civitas illa Fortis Teleport spell, Quetzal Transport System access and 3,000 Thieving XP. It is the first teleport a locked account is allowed to use, because its destination is inside the region. Note the quest does return the player to Varrock's east gate during its steps, so the plugin should whitelist that leg or warn about it.<\/p><p><b>Trigger / detection:<\/b> quest state read. On completion, un-flag the Civitas illa Fortis Teleport entry inside <code>SpellTeleportBlocker<\/code>'s allow list and post a chat line saying the spell is now legal.<\/p><p><b>Why it fits:<\/b> the plugin's whole premise is \"which travel is legal here\", so the moment a legal teleport appears deserves to be marked.<\/p><p><b>Feasibility:<\/b> easy. Quest state plus a boolean flip in the existing spell-blocking set.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Twilight%27s_Promise\">Wiki: Twilight's Promise<\/a>"}, {"id": "hunter-46-guild", "title": "Hunter 46 &mdash; Hunter Guild access", "summary": "A hard, non-boostable level gate on the building that runs the whole quetzal-whistle economy.", "html": "<p>The Hunter Guild in the Avium Savannah requires Hunter 46 to enter, and it is the gateway to Hunters' Rumours, Imia's Supplies, Pellem's Fur Store, a bank three tiles from a cooking fire, and The Roost where quetzals are raised and whistles recharged. For a locked account this is the single most load-bearing skill level in the region.<\/p><p><b>Trigger / detection:<\/b> listen for <code>StatChanged<\/code> on Hunter and fire once when the level reaches 46; also check on login so an account that arrives already qualified is ticked. Show a live \"Hunter 46 in N levels\" countdown before that.<\/p><p><b>Why it fits:<\/b> it converts a grind with no visible payoff into a countdown toward a named unlock.<\/p><p><b>Feasibility:<\/b> easy. Skill-level events are a core RuneLite API.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Hunter_Guild\">Wiki: Hunter Guild<\/a>"}, {"id": "basic-quetzal-whistle", "title": "Ten rumours &mdash; the basic quetzal whistle", "summary": "Ten completed Hunters' Rumours earn the blueprint; a willow log and a knife turn it into the region's fast travel.", "html": "<p>Soar Leader Pitri hands out the basic whistle blueprint at ten completed rumours (replacement blueprints cost 500 gp), and the whistle itself is carved from a willow log with a knife. Rumour tiers run Novice (46, Huntmaster Gilman), Adept (57), Expert (72) and Master (91, plus At First Light). The 100-rumour and 250-rumour marks award the enhanced and perfected blueprints, so this milestone is really the first rung of a long counter.<\/p><p><b>Trigger / detection:<\/b> two signals. Count rumour completions from the chat message on hand-in (and/or the rumour varbit if one is exposed), and independently tick the milestone when a <i>Basic quetzal whistle<\/i> item ID appears in inventory or equipment.<\/p><p><b>Why it fits:<\/b> it is the first mobility the account earns rather than is given, and it is entirely internal to Varlamore, so it never conflicts with the lock.<\/p><p><b>Feasibility:<\/b> easy for the item check; the rumour counter is chat-parsing, which is standard but should be written defensively against message-text changes.<\/p><p><b>Challenge:<\/b> Every number is right, including the 500 gp replacement and the (Hunter+5)×modifier XP formula. The problem is overlap: the Hunter Rumours plugin on the Plugin Hub already counts rumours and routes assignments, so building a second counter invites the reviewer question \"why is this in a region-lock plugin?\". Keep the 10/100/250 blueprint markers, drop the rest. The \"(expert and master loot sacks only)\" parenthetical on the enhanced and perfected blueprints is also unverified. Missing: the basic whistle only holds five charges, refilled with raw hunter meats at The Roost (quetzal feed 1, raw dashing kebbit 3).<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Hunters%27_Rumours\">Wiki: Hunters' Rumours<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Basic_quetzal_whistle\">Wiki: Basic quetzal whistle<\/a>"}, {"id": "quetzal-network-complete", "title": "All fourteen quetzal landing sites", "summary": "Eight sites come free; six must be built at roughly 30,330 gp each.", "html": "<p>Aldarin, Auburnvale, Civitas illa Fortis, Hunter Guild, Quetzacalli Gorge, Sunset Coast, Tal Teklan and The Teomat are available by default. Cam Torum entrance, Colossal Wyrm Remains, Fortis Colosseum, Kastori, Outer Fortis and Salvager Overlook each need 10 quetzal feed, 3 limestone bricks and 4 soft clay &mdash; about 30,330 gp per site, roughly 181,980 gp for all six. Auburnvale's landing spot is five tiles from the bank, the closest of any site.<\/p><p><b>Trigger / detection:<\/b> each built site is server-side state, so read the per-site varbits (identify them once by diffing varbits across a build) and render a six-of-six sub-bar. Fall back to a manual tick-box per site if a varbit cannot be pinned down &mdash; the exact varbit indices are <b>unverified<\/b> here and must be confirmed in-client.<\/p><p><b>Why it fits:<\/b> it is the closest thing the region has to a personal infrastructure project, and it is a gp sink a no-trade account genuinely feels.<\/p><p><b>Feasibility:<\/b> easy once the varbits are identified; the manual fallback keeps the feature shippable in the meantime.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Quetzal_Transport_System\">Wiki: Quetzal Transport System<\/a>"}, {"id": "death-on-the-isle-pendant", "title": "Death on the Isle and the Pendant of Ates network", "summary": "Adds the North Aldarin teleport destination to a pendant that starts inert.", "html": "<p>Death on the Isle (Thieving 34, Agility 32) starts with Patzi at the Villa Lucens entrance in Aldarin, never leaves the region, and rewards 10,000 Thieving / 7,500 Agility / 5,000 Crafting XP plus the North Aldarin destination for the Pendant of Ates. The pendant itself is a rare untradeable drop and starts with no destinations until the statue of Ates at each of its six sites is activated, so this milestone should be tracked as two halves: pendant obtained, and each statue switched on. North Aldarin specifically also needs Constantinius pickpocketed for a key and the icon from the fancy chest used on the statue.<\/p><p><b>Trigger / detection:<\/b> quest state for the quest half; item ID in inventory or equipment for the pendant half; per-statue activation is likely varbit-backed (<b>unverified<\/b> &mdash; confirm indices in-client) with a chat-message fallback on first activation.<\/p><p><b>Why it fits:<\/b> it is the clearest example in the region of a teleport that expands the map without ever breaking the lock.<\/p><p><b>Feasibility:<\/b> easy for the quest and item; medium for statue-by-statue tracking until the varbits are confirmed.<\/p><p><b>Challenge:<\/b> The quest facts hold up exactly (Thieving 34, Agility 32, 10,000/7,500/5,000 XP, never leaves the region), but the pendant half inherits the destination error corrected on the key-items page: six sites, not four, and Salvager Overlook is not one of them. Tracking \"statues activated\" also needs a charge row beside it &mdash; a pendant at zero frozen tears is as inert as one with no statues lit.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Death_on_the_Isle\">Wiki: Death on the Isle<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Pendant_of_Ates\">Wiki: Pendant of Ates<\/a>"}, {"id": "perilous-moons", "title": "Perilous Moons &mdash; first boss content", "summary": "Slayer 48, Hunter 20, Fishing 20, Runecraft 20, Construction 10 open Neypotzli, the Moons of Peril and the Lunar Chest.", "html": "<p>Perilous Moons is the first real combat milestone that stays inside Varlamore. It awards 2 quest points and 40,000 Slayer XP, and unlocks Neypotzli, the three Moon bosses, lesser nagua Slayer assignments and the Lunar Chest at the Ancient Shrine. All three Moons must be beaten once before the chest opens at all; each of its thirteen uniques sits at 1/224.<\/p><p><b>Trigger / detection:<\/b> quest state for the quest; then a sub-tracker with three booleans (Blue, Blood, Eclipse defeated) driven by the boss-kill chat messages, and a chest-opened counter from the loot-received message.<\/p><p><b>Why it fits:<\/b> the Runecraft 20 and Construction 10 requirements are exactly the skills the research flagged as hard to train in-region, so this milestone doubles as a warning to plan those early.<\/p><p><b>Feasibility:<\/b> easy for quest state; chat parsing for kills and chest opens is routine.<\/p><p><b>Challenge:<\/b> Requirements and the 40,000 Slayer XP are correct, and so is the 1/224 unique rate. The reward list is short by 5,000 XP each in Runecraft, Hunter and Fishing — which matters here specifically, because Runecraft is the skill the item itself flags as unreachable in region, and this quest is one of only two documented sources of Runecraft XP inside the lock.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Perilous_Moons\">Wiki: Perilous Moons<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Lunar_Chest\">Wiki: Lunar Chest<\/a>"}, {"id": "colosseum-glory", "title": "Fortis Colosseum &mdash; waves and glory tiers", "summary": "Eleven waves of enemies then Sol Heredit, with six glory tiers at 2,000 / 5,000 / 8,000 / 12,000 / 16,000 / 20,000.", "html": "<p>The Colosseum is twelve waves: eleven of regular enemies, then Sol Heredit. Glory is awarded per wave based on damage taken, time and modifiers, and only your personal best counts &mdash; it is a high-score, not a currency. The tiers are Brawler 2,000 (bank chest), Challenger 5,000 (respawn point in Civitas illa Fortis), Gladiator 8,000 (better prices from NPCs &mdash; Oriana pays 65 gp per valuable instead of 55), Hero 12,000 (ring of dueling teleport to the Colosseum), Champion 16,000 (disease-free herb patch) and Grand Champion 20,000 (Fortis Salute emote). Note the Brawler reward is worthless to an Ultimate Ironman, which is itself worth saying in the panel.<\/p><p><b>Trigger / detection:<\/b> parse the wave-complete and glory-awarded chat messages or the Colosseum interface widget; persist best wave and best glory in config so the ladder survives logout.<\/p><p><b>Why it fits:<\/b> twelve waves and six tiers are a ready-made progress bar that Jagex already designed, and every reward on it is Varlamore-native.<\/p><p><b>Feasibility:<\/b> easy. Widget or chat reads plus config persistence &mdash; no game state is touched.<\/p><p><b>Challenge:<\/b> The tiers and thresholds are exactly right, but Gladiator was left blank: 8,000 glory improves NPC rates, which is the same unlock that raises Oriana's payout for stolen valuables from 55 to 65 gp. That makes the glory ladder and the Thieving overlay the same feature seen twice, and they should share a data source rather than each hard-code a number.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_Colosseum\">Wiki: Fortis Colosseum<\/a>"}, {"id": "dizanas-quiver", "title": "Dizana's quiver and Sunfire fanatic armour", "summary": "The region's best-in-slot native gear, all of it earned inside the Colosseum.", "html": "<p>Dizana's quiver is the guaranteed completion reward for beating Sol Heredit; Sunfire fanatic armour pieces drop from wave 4 onward, Tonalztics of Ralos from wave 7 onward, plus the Echo crystal and the Smol Heredit pet. For an account that can never import gear, this is the endgame kit, and the quiver in particular is the trophy the whole ladder points at.<\/p><p><b>Trigger / detection:<\/b> item IDs in inventory or equipment, ticked once on first sight; the Bosses tab of the collection log also has a Fortis Colosseum subsection the panel can mirror. A drop-received chat message gives a second, redundant signal.<\/p><p><b>Why it fits:<\/b> it is the natural \"you have finished the hard part\" marker, and it is the obvious gate for the biggest quality-of-life unlocks.<\/p><p><b>Feasibility:<\/b> easy. Item-ID matching is already the core of the existing item blocker.<\/p><p><b>Challenge:<\/b> Facts confirmed: the quiver is guaranteed from Sol Heredit, Sunfire fanatic pieces drop from wave 4 and Tonalztics from wave 7. The feasibility claim is too optimistic though. The collection log cannot be polled — its contents are only readable while the player has the interface open, so \"mirror the Bosses tab\" means scraping opportunistically and caching in ConfigManager, not reading on demand. Make item-ID sightings the primary signal and the log the backfill, not the other way round.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Dizana%27s_quiver\">Wiki: Dizana's quiver<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Fortis_Colosseum\">Wiki: Fortis Colosseum<\/a>"}, {"id": "final-dawn-doom", "title": "The Final Dawn and Doom of Mokhaiotl", "summary": "The last quest in the line, then the region's newest and hardest boss.", "html": "<p>The Final Dawn (Thieving 66, Runecraft 52, Fletching 52, after The Heart of Darkness, Perilous Moons and Twilight's Promise) awards 3 quest points, the Arkan blade, 55,000 Thieving XP and access to the Crypt of Tonali and Doom of Mokhaiotl &mdash; which carries fifteen Combat Achievement tasks of its own. The Heart of Darkness (Mining 55, Thieving 48, Slayer 48, Agility 46) sits immediately before it and opens the Tapoyauik dungeon. A first Doom kill is the current \"you have seen everything Varlamore has\" marker.<\/p><p><b>Trigger / detection:<\/b> quest states for both quests; first Doom kill from the kill-count chat message or the collection-log Bosses subsection. Flip the overall progress bar to 100% and award a completionist badge in the panel.<\/p><p><b>Why it fits:<\/b> it gives the whole ladder a defined top, which a self-imposed challenge otherwise lacks.<\/p><p><b>Feasibility:<\/b> easy. Purely cosmetic panel state driven by quest state and a chat message.<\/p><p><b>Challenge:<\/b> Requirements, the Arkan blade and 55,000 Thieving XP are all correct, and Doom really does carry 15 Combat Achievement tasks. The reward list omits 25,000 Runecraft and 25,000 Fletching XP plus a 55,000 XP combat lamp — again the Runecraft point, since those 25,000 XP are most of what a locked account will ever bank in that skill.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/The_Final_Dawn\">Wiki: The Final Dawn<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Doom_of_Mokhaiotl\">Wiki: Doom of Mokhaiotl<\/a>"}, {"id": "x-varlamore-combat-achievements", "title": "The sixty Varlamore Combat Achievements", "summary": "No Varlamore Achievement Diary exists, but sixty Combat Achievement tasks across five native bosses do.", "html": "<p>Varlamore has no Achievement Diary — the diary list names twelve regions and Varlamore is not among them — so the region's only official completion ladder is its Combat Achievements. There are sixty of them across five bosses that never leave the region: Fortis Colosseum 13, Moons of Peril 12, The Hueycoatl 11, Amoxliatl 9, and Doom of Mokhaiotl 15. Notably the proposed milestone ladder covers only two of those five; The Hueycoatl at The Darkfrost and Amoxliatl in the Ruins of Tapoyauik appear nowhere, despite Amoxliatl being the 1/25 Pendant of Ates source and the sole supplier of the frozen tears that charge it.<\/p><p><b>Trigger / detection:<\/b> scrape the Combat Achievements interface when the player opens it and cache per-task completion in <code>ConfigManager<\/code>, topped up live by the per-task completion chat message. Filter to the five Varlamore task lists and render one sixty-task bar with five sub-bars. No varbit hunting required, and the cache survives logout.<\/p><p><b>Why it fits:<\/b> a self-imposed challenge needs an externally defined finish line, and this is the only one Jagex actually shipped for the region. It also drags two ignored bosses onto the ladder.<\/p><p><b>Feasibility:<\/b> easy to medium. Widget scraping plus chat parsing plus config persistence; the only real constraint is that the tally is stale until the player opens the interface once.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Combat_Achievements\">Wiki: Combat Achievements<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Amoxliatl\">Wiki: Amoxliatl<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/The_Hueycoatl\">Wiki: The Hueycoatl<\/a>"}]}, {"id": "key-items", "title": "Key items", "lead": "Seventeen items whose supply inside Varlamore is thin enough that losing one is a real setback for a bankless account.", "intro_html": "<p>An Ultimate Ironman carries everything they own, and on death everything they own drops to the ground and despawns in an hour &mdash; no gravestone, no Death's Coffer. That makes \"how many places in Varlamore sell this?\" the most important number about any tool. The list below is ordered by how badly a single-source item hurts to lose.<\/p><p>For each item the checklist can do three things: tick it the first time it is ever held, pin the one shop that sells it on the world map, and warn before it is dropped, alched or used up. The single-source and unobtainable flags come straight from the shop survey.<\/p>", "items": [{"id": "knife", "title": "Knife", "summary": "Common (seven shops) but the gateway to the quetzal whistle and all fletching.", "html": "<p>Sold at all seven Varlamore general stores &mdash; Fortis, Aldarin, Cam Torum, Kastori, Sunset Coast, Tal Teklan and Auburnvale &mdash; for a handful of coins. Low risk, high consequence: the basic quetzal whistle is carved from a willow log <i>with a knife<\/i>, Vale Totems requires a knife to play, and the fletching knife from the Vale Research Exchange is the upgrade path.<\/p><p><b>Sources / count:<\/b> 7 shops. COMMON.<\/p><p><b>What the plugin shows:<\/b> a checklist tick on first acquisition, and a soft reminder rather than a hard warning if the last knife leaves the inventory &mdash; replacements are cheap and everywhere.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_General_Store\">Wiki: Fortis General Store<\/a>"}, {"id": "tiered-axe", "title": "Iron to adamant axe", "summary": "Lunami's Axe Shop in Auburnvale is the only tiered axe seller in the region.", "html": "<p>Bronze axes turn up in four general stores, but anything above bronze comes only from Lunami's Axe Shop in Auburnvale, which sells bronze through adamant axes and battleaxes with no Woodcutting level requirement attached to the purchase. Vale Totems eats logs by the hundred, so axe tier directly limits Fletching training throughput.<\/p><p><b>Sources / count:<\/b> 1 shop. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> a map pin on Lunami's, a checklist row per tier held, and a drop warning on the highest-tier axe currently owned.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Lunami%27s_Axe_Shop\">Wiki: Lunami's Axe Shop<\/a>"}, {"id": "full-range-pickaxe", "title": "Iron to rune pickaxe", "summary": "Tizoro's Pickaxes in Cam Torum is the only vendor covering the full tier range.", "html": "<p>Bronze pickaxes are everywhere and Mistrock Mining Supplies stocks iron and steel, but Tizoro's Pickaxes in Cam Torum is the only shop in Varlamore selling the complete bronze-to-rune range. Mining matters here beyond ore: calcified rocks in the Cam Torum mine (Mining 41) drop 1&ndash;3 blessed bone shards each, which is the region's Prayer training loop.<\/p><p><b>Sources / count:<\/b> 2 shops for iron/steel, 1 for mithril and above. RARE above steel.<\/p><p><b>What the plugin shows:<\/b> a tier checklist, a Cam Torum map pin, and a warning before the best pickaxe owned is dropped anywhere outside a safe area.<\/p><p><b>Challenge:<\/b> Tizoro's full bronze-to-rune range was not re-confirmed in this pass and should be treated as unverified before a \"only full-range vendor\" badge ships. The calcified-rock facts behind it are solid (Mining 41, 1–3 shards, 74/75 success), but they are not the only shard source — the Colossal Wyrm Agility Course scoops 22–38 shards at an 80% rate, which is a far better Prayer input and is missing from the whole document.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Tizoro%27s_Pickaxes\">Wiki: Tizoro's Pickaxes<\/a>"}, {"id": "saw", "title": "Saw", "summary": "13 gp at the Auburnvale sawmill &mdash; and nowhere else in Varlamore.", "html": "<p>The Auburnvale sawmill is the only place in the region that sells a saw. It also converts logs to planks and is the closest sawmill to a bank anywhere in the game, which matters for the Construction requirements on Scrambled! (38), Shadows of Custodia (41) and At First Light (27).<\/p><p><b>Sources / count:<\/b> 1 shop. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> a checklist tick, a sawmill map pin, and a note on the Construction-gated quests that a saw is needed before attempting them.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Sawmill\">Wiki: Sawmill<\/a>"}, {"id": "shears", "title": "Shears", "summary": "Artima's Crafting Supplies in the Fortis Bazaar is the region's only seller.", "html": "<p>Shears exist in exactly one Varlamore shop: Artima's Crafting Supplies in the Civitas illa Fortis Bazaar. Without them there is no shearing, no wool, no spinning chain at the Aldarin or Auburnvale looms.<\/p><p><b>Sources / count:<\/b> 1 shop. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> a checklist tick, a Bazaar map pin shared with the glassblowing pipe entry, and a hard confirm dialog before dropping the only pair carried.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Artima%27s_Crafting_Supplies\">Wiki: Artima's Crafting Supplies<\/a>"}, {"id": "glassblowing-pipe", "title": "Glassblowing pipe", "summary": "Also Artima's only &mdash; and the Sunset Coast sand pit is useless without it.", "html": "<p>The glassblowing pipe shares Artima's as its sole Varlamore source. Sunset Coast has a sand pit at the village's northern end and the region has furnaces at Tal Teklan, Cam Torum and Auburnvale, so the entire glassmaking chain hangs on one shop in the capital. Vials are separately buyable (Aldarin, Tal Teklan, Auburnvale, Huito's), so the pipe is about molten glass for orbs and lanterns rather than basic Herblore supply.<\/p><p><b>Sources / count:<\/b> 1 shop. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> a checklist tick, an Artima's pin, and a \"Crafting unlocked\" milestone that lights up only when both the pipe and shears are held.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Artima%27s_Crafting_Supplies\">Wiki: Artima's Crafting Supplies<\/a>"}, {"id": "farming-toolkit", "title": "Farming toolkit (rake, dibber, secateurs, watering can, trowel)", "summary": "All five come from Kastori Farming Supplies and nowhere else in the region.", "html": "<p>Rake, seed dibber, secateurs, spade, gardening trowel, watering can, plant pots, compost and plant cure are all stocked at Kastori Farming Supplies. The spade is also in the general stores, but the other five are Kastori-only, which means an account that has not reached Kastori has no shop-bought Farming tools anywhere in Varlamore. The patches those tools serve are spread wide: Ortus Farm (allotment, herb, flower) at Civitas illa Fortis, hops and wheat at Aldarin, calquat, flower and fruit tree at Kastori, a level-63 belladonna patch at Auburnvale, and the hardwood patch at Locus Oasis from The Ribbiting Tale.<\/p><p><b>Sources / count:<\/b> 1 shop for five of the six tools. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> one grouped checklist row with five ticks, a Kastori pin, and a warning if the player is about to drop the last of any of the five.<\/p><p><b>Challenge:<\/b> The five Kastori-only tools are confirmed, but the item stops one step short of the mechanic that makes them survivable. Tool leprechauns store rake, dibber, secateurs, watering can, trowel and spade for free and account-wide, and stored tools do not drop on death — which for a bankless account is the only free storage in Varlamore. A \"drop warning\" is the wrong payload here; \"you are carrying a secateurs past a leprechaun\" is the right one.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Kastori_Farming_Supplies\">Wiki: Kastori Farming Supplies<\/a>"}, {"id": "bow-string", "title": "Bow string", "summary": "No shop in Varlamore sells it; the only route is the bow string spool from Vale Totems.", "html": "<p>This is the sharpest supply hole in the region. Bow string has no Varlamore shop source at all. The only documented route is the bow string spool, bought for 250 vale research points at the Vale Research Exchange in Auburnvale, which requires playing Vale Totems (Fletching 20, plus a knife and an axe or logs). Flax bales also turn up when rummaging offerings, and the Auburnvale tannery has a loom on site, but the spool is the reliable path.<\/p><p><b>Sources / count:<\/b> 1, minigame-gated. SINGLE-SOURCE / RARE.<\/p><p><b>What the plugin shows:<\/b> a research-point progress bar toward 250, a checklist tick when the spool is obtained, and a warning that string cannot simply be re-bought if the spool is lost.<\/p><p><b>Challenge:<\/b> The 250-point cost is right, but incomplete: maximising the spool's capacity costs a further 1,250 points, so the real target for a bankless account is 1,500, not 250. The proposed progress bar also assumes vale research points are exposed to the client in a readable varbit, which is unverified — plan for a chat-parsed or manual counter.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Vale_Research_Exchange\">Wiki: Vale Research Exchange<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Vale_Totems_(minigame)\">Wiki: Vale Totems<\/a>"}, {"id": "law-runes", "title": "Law runes", "summary": "The Runic Emporium in Cam Torum is the only Varlamore shop that stocks them.", "html": "<p>Both regional rune shops sell the elemental and common catalytic runes. Law runes are the problem: The Runic Emporium's stock table does <i>not<\/i> list them, and the Law rune page names only the Mage Arena, the Wizards' Guild, Ali Morrisane, Tutab's and Amlodd's as vendors &mdash; none of them in Varlamore. Cosmic runes are the one genuine single-source case &mdash; Tal Teklan only, thirty in stock. This matters doubly because Varlamore has no confirmed rune or pure essence source, so a locked account cannot craft its own runes and is entirely dependent on these two shops.<\/p><p><b>Sources / count:<\/b> 0 confirmed shops for law, 1 for cosmic, 2 for the rest. Law runes are provisionally UNOBTAINABLE in region.<\/p><p><b>What the plugin shows:<\/b> a live rune-stock panel row (\"law: no confirmed Varlamore vendor — ration them\"), a map pin per rune type, and a low-stock nudge when carried law runes drop below a configurable threshold.<\/p><p><b>Challenge:<\/b> The Cam Torum attribution is wrong, or at best contested. The Runic Emporium's stock list has no law rune on it, and the <a href=\"https://oldschool.runescape.wiki/w/Law_rune\">Law rune<\/a> page lists no Varlamore vendor at all; confusingly, the Tal Teklan Rune Shop's lede sentence mentions law runes while its own stock table does not. Three pages disagree, so this must be settled in-client before any panel row asserts it. It matters more than it looks: law runes are the telekinetic-grab reagent for the one snape grass spawn in the region.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/The_Runic_Emporium\">Wiki: The Runic Emporium<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Tal_Teklan_Rune_Shop\">Wiki: Tal Teklan Rune Shop<\/a>"}, {"id": "bows-and-arrows", "title": "Bows and arrows", "summary": "Arcuani's Archery Supplies in Tal Teklan is the region's only ranged vendor.", "html": "<p>Arcuani's stocks shortbows and longbows from normal through maple and arrows from bronze through rune. There is no second archery shop in Varlamore, so an account that has not reached Tal Teklan has no shop-bought ranged gear at all &mdash; and Ranged 90+ is among the recommended stats for a full Colosseum clear.<\/p><p><b>Sources / count:<\/b> 1 shop. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> a checklist tick for the first bow and first stack of arrows, a Tal Teklan pin, and an arrow-count infobox that warns when the stack is low and the nearest resupply is a long walk.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Arcuani%27s_Archery_Supplies\">Wiki: Arcuani's Archery Supplies<\/a>"}, {"id": "elemental-staves", "title": "Elemental staves", "summary": "Sebamo's Sublime Staffs in Auburnvale, and it explicitly does not stock battlestaves.", "html": "<p>Sebamo's sells the plain staff, magic staff and the four elemental staves &mdash; and, per its own shop lore about ents mistaking a delivery cart for a gift, no battlestaves. Combined with the absence of essence in the region, this defines the whole Magic ceiling for a locked account: shop-bought runes plus a basic elemental staff.<\/p><p><b>Sources / count:<\/b> 1 shop. SINGLE-SOURCE. Battlestaves: UNOBTAINABLE in region.<\/p><p><b>What the plugin shows:<\/b> a checklist row per elemental staff, an Auburnvale pin, and an explicit \"battlestaves are not obtainable here\" line so the player does not go hunting for one.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Sebamo%27s_Sublime_Staffs\">Wiki: Sebamo's Sublime Staffs<\/a>"}, {"id": "prayer-potions-antipoison", "title": "Prayer potions and antipoison", "summary": "No shop in Varlamore sells either; both come only through Mastering Mixology.", "html": "<p>There is no direct seller of prayer potions or antipoison anywhere in the region. Prayer potions arrive through Mastering Mixology potion packs at the Alchemical Society in Aldarin (Herblore 60 plus Children of the Sun) or as a Prayer potion(1) drop from Frost Nagua; antipoison comes only from the apprentice and adept packs. Snape grass does have a Varlamore source &mdash; a single spawn in Civitas illa Fortis, reachable only with Telekinetic Grab &mdash; so brewing your own is slow but not impossible.<\/p><p><b>Sources / count:<\/b> 1 minigame for antipoison, 2 routes for prayer potions. SINGLE-SOURCE / RARE.<\/p><p><b>What the plugin shows:<\/b> a \"Prayer restoration access: minigame-gated\" status row, a Herblore-60 countdown, and a carried-dose counter before any boss trip.<\/p><p><b>Challenge:<\/b> Two corrections. Snape grass is <i>not<\/i> absent from the region: the <a href=\"https://oldschool.runescape.wiki/w/Snape_grass\">Snape grass<\/a> page lists one Civitas illa Fortis spawn, telegrab-only. And the apprentice potion pack contains prayer potions, antipoison <i>and<\/i> superantipoison, while Amoxliatl drops prayer potions outright &mdash; so the honest status line is \"three routes, all slow\", not \"minigame-gated\". Note also that the reward shop is priced in Mox, Aga and Lye, not coins.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Mastering_Mixology\">Wiki: Mastering Mixology<\/a>"}, {"id": "pendant-of-ates", "title": "Pendant of Ates", "summary": "An untradeable rare drop, not a purchase &mdash; 1/100 from Frost Nagua, 1/25 from Amoxliatl post-quest.", "html": "<p>The pendant is the region's own teleport network in item form, with six destinations: The Darkfrost, the Twilight Temple, Ralos' Rise, North of Kastori, Nemus Retreat, and North Aldarin once Death on the Isle is done. It starts inert: destinations only work after the statue of Ates at each one is activated, and the pendant holds up to 1,000 charges fed one at a time by frozen tears. Because it is untradeable and drop-only, an Ultimate Ironman who dies with it and fails to return within the hour has genuinely lost it.<\/p><p><b>Sources / count:<\/b> 2 drop tables, no shop. RARE.<\/p><p><b>What the plugin shows:<\/b> a \"found, not bought\" checklist tick, a separate statues-activated sub-list, map pins for every unlocked destination, and the loudest drop warning in the whole plugin.<\/p><p><b>Challenge:<\/b> The destination list was wrong. There are six &mdash; The Darkfrost, Twilight Temple, Ralos' Rise, North Aldarin, North of Kastori and Nemus Retreat &mdash; and Salvager Overlook is not among them, while Ralos' Rise and Nemus Retreat were missing. The proposals also never mention the charge economy: 1,000 charges, one per frozen tear, refundable back to tears. Frozen tears come from Amoxliatl, which is also the 1/25 pendant source, so the pendant and its fuel share a single boss.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Pendant_of_Ates\">Wiki: Pendant of Ates<\/a>"}, {"id": "quetzal-whistle-item", "title": "Basic quetzal whistle", "summary": "Blueprint at 10 rumours, carved from a willow log with a knife; replacement blueprints cost 500 gp.", "html": "<p>The whistle is the region's fast travel and the single most convenience-dense item a locked account can carry. The blueprint comes free from Soar Leader Pitri at ten completed Hunters' Rumours, with the enhanced blueprint at 100 rumours and the perfected at 250 (expert and master loot sacks only). Whistles are recharged at The Roost atop the Hunter Guild. Losing the whistle is recoverable &mdash; another willow log and a knife &mdash; but only if the blueprint is still held or 500 gp is spent.<\/p><p><b>Sources / count:<\/b> 1 route, Hunter-Guild gated. SINGLE-SOURCE.<\/p><p><b>What the plugin shows:<\/b> a rumour counter with markers at 10 / 100 / 250, a checklist tick per whistle tier crafted, and a charge-remaining infobox with a Roost reminder when it runs low.<\/p><p><b>Challenge:<\/b> Correct throughout, and the blueprint milestones are verified. Two gaps: the basic whistle holds only five charges, and recharging is not a service you pay for at The Roost but a feeding — Soar Leader Pitri takes raw hunter meats, one charge per quetzal feed and three per raw dashing kebbit. A charge infobox therefore needs a \"meat carried\" row beside it or it tells the player a problem without the fix.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Basic_quetzal_whistle\">Wiki: Basic quetzal whistle<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Hunters%27_Rumours\">Wiki: Hunters' Rumours<\/a>"}, {"id": "unobtainable-watchlist", "title": "The unobtainable watchlist", "summary": "Holy symbol, amulet of glory, rune and pure essence, battlestaves, cooking gauntlets — and two entries that turned out not to belong.", "html": "<p>Five staples have no confirmed Varlamore source. Holy symbol is sold at Brimhaven and blessed at Edgeville Monastery, neither in region. Amulet of glory cannot be made or charged here. Rune and pure essence have no mine, shop or altar in Varlamore, which caps Runecrafting at whatever quests award. Battlestaves and cooking gauntlets round out the list. Two entries have since fallen off it: the ring of dueling is in fact craftable end to end inside Varlamore (gold ore at the Stonecutter Outpost, a ring mould from Artima's, a cut emerald from Toci's, then Lvl-2 Enchant with a Tal Teklan cosmic rune), and snape grass has a telegrab spawn in Civitas illa Fortis.<\/p><p><b>Sources / count:<\/b> 0 each. UNOBTAINABLE.<\/p><p><b>What the plugin shows:<\/b> a permanently greyed-out section of the checklist with a one-line explanation each, so the player stops looking &mdash; plus, for any of these carried in from before the lock, a maximum-severity drop warning, because there is no second one.<\/p><p><b>Challenge:<\/b> Two of the original seven were wrong. A ring of dueling can be built without leaving the region: gold ore at the <a href=\"https://oldschool.runescape.wiki/w/Stonecutter_Outpost\">Stonecutter Outpost<\/a> (Mining 65), a furnace and a ring mould from Artima's, a cut emerald from <a href=\"https://oldschool.runescape.wiki/w/Toci%27s_Gem_Store\">Toci's Gem Store<\/a>, then Lvl-2 Enchant at Magic 27 with one cosmic and three air runes. And snape grass has a Civitas illa Fortis spawn. A greyed-out list is only useful if it is right — a wrong entry actively stops a player from trying something that works.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Holy_symbol\">Wiki: Holy symbol<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Pure_essence\">Wiki: Pure essence<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Ring_of_dueling\">Wiki: Ring of dueling<\/a>"}, {"id": "x-tool-leprechaun", "title": "Tool leprechauns — the region's only free storage", "summary": "Stored farming tools do not drop on death, which for a bankless account makes leprechauns the closest thing to a bank in Varlamore.", "html": "<p>The farming toolkit entry is right that rake, seed dibber, secateurs, watering can and gardening trowel come from Kastori Farming Supplies and nowhere else in the region. What it misses is the mechanic that makes those single-source tools survivable at all: tool leprechauns store all of them, for free, account-wide, and tools sitting in leprechaun storage are not on your person and therefore do not hit the floor when you die. For an Ultimate Ironman with no bank, no Coffer and a one-hour despawn timer, that is the only free storage inside Varlamore.<\/p><p>Leprechauns sit with the patches the region already has — Ortus Farm outside Civitas illa Fortis, the Kastori patches, and the hardwood patch at Locus Oasis that The Ribbiting Tale unlocks — which means the Kastori shopping trip and the storage trip are the same trip.<\/p><p><b>Sources / count:<\/b> storage, not supply — but it converts five SINGLE-SOURCE items into recoverable ones.<\/p><p><b>What the plugin shows:<\/b> a per-tool row saying <i>carried<\/i>, <i>stored<\/i> or <i>neither<\/i>; a map pin on the nearest leprechaun; and a warning when a Kastori-only tool is being carried into combat while its storage slot sits empty. The farming tool storage state is varp-backed and already read by other RuneLite plugins, so the row is a state read rather than a guess.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Tool_leprechaun\">Wiki: Tool leprechaun<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Kastori_Farming_Supplies\">Wiki: Kastori Farming Supplies<\/a>"}, {"id": "x-prayer-potion-chain", "title": "The in-region prayer potion chain", "summary": "Snape grass does exist in Varlamore — one telegrab spawn in the capital — which turns prayer potions from minigame-gated into a five-step supply chain.", "html": "<p>The prayer potion entry treats Mastering Mixology as the only route because snape grass was assumed absent from the region. It is not: the Snape grass page lists a spawn in Civitas illa Fortis, obtainable with Telekinetic Grab. That single spawn changes the picture, because every other link in the chain is already in region — vials from four shops, water sources everywhere, herb patches at Ortus Farm and, at 16,000 Colosseum glory, a disease-free herb patch as a Champion-tier reward. Amoxliatl drops prayer potions outright as a third route.<\/p><p>So the honest status is three slow routes, not one gate, and the interesting thing to show a locked account is the chain rather than a verdict: which link is currently missing.<\/p><p><b>Sources / count:<\/b> 3 routes (Mixology packs, Amoxliatl drops, self-brewed). RARE, not gated.<\/p><p><b>What the plugin shows:<\/b> a tile marker on the Civitas illa Fortis snape grass spawn; a readiness row checking the telegrab reagents (law and air runes, Magic 33) against what is carried; and a chain view ticking ranarr weed, clean ranarr, vial of water, unfinished potion and finished dose, so the missing link is named rather than inferred. The law rune row doubles as the warning that law runes themselves have no confirmed Varlamore vendor.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Snape_grass\">Wiki: Snape grass<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Prayer_potion\">Wiki: Prayer potion<\/a>"}]}, {"id": "qol-unlocks", "title": "Milestone-gated quality of life", "lead": "Thirteen conveniences the plugin keeps switched off until the account has earned the in-game unlock they belong to.", "intro_html": "<p>The point of gating is that the convenience arrives at the same moment the game's own reward does, so the plugin never feels like it is handing out an advantage. Every gate below is a real in-game unlock &mdash; a quest, a skill level, a glory tier, an item &mdash; and every payload is an overlay, an infobox, a chat line, a map pin or a menu-entry edit.<\/p><p>None of these create items, move the player, or alter a server-side requirement. Where a gate depends on a varbit index that has not been confirmed in-client, that is flagged in the item.<\/p>", "items": [{"id": "landing-site-atlas", "title": "Unlock the landing-site atlas after the basic quetzal whistle", "summary": "A world-map and minimap overlay showing which of the fourteen quetzal sites are built and what the next one costs.", "html": "<p>Once the first whistle is carved, the panel opens an atlas: eight default sites marked as available, six buildable sites marked with their cost (10 quetzal feed, 3 limestone bricks, 4 soft clay, roughly 30,330 gp each), and a running total toward the ~181,980 gp for all six. Auburnvale is flagged as the five-tile-from-bank site.<\/p><p><b>Gated on:<\/b> a Basic quetzal whistle item ID appearing in inventory or equipment.<\/p><p><b>Why the gate fits:<\/b> the atlas is meaningless before the whistle exists, and showing it early would just be a wiki page pasted into the client.<\/p><p><b>Feasibility:<\/b> easy for the static site coordinates and costs; the built/unbuilt state needs per-site varbits which are <b>unverified<\/b> here &mdash; ship with manual tick-boxes and swap to varbits once identified.<\/p><p><b>Challenge:<\/b> Costs and site counts are exact. The gate is the best in the section — but note the whistle is not the only in-region teleport worth atlas space, and the atlas will look incomplete beside the Colossal wyrm teleport scroll (40 termites) and the six Pendant of Ates statues. Consider one unified in-region travel atlas gated on the first earned teleport, rather than three overlapping overlays.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Quetzal_Transport_System\">Wiki: Quetzal Transport System<\/a>"}, {"id": "fortis-teleport-legal", "title": "Unlock the Civitas illa Fortis Teleport allow-listing after Twilight's Promise", "summary": "The spell stops being flagged and starts being highlighted as the first legal teleport.", "html": "<p>Before the quest, the spell does not exist and the spellbook entry is dead. After it, the plugin moves Civitas illa Fortis Teleport out of the blocked set, highlights it in the spellbook widget, and posts a one-time chat line explaining that this teleport is in-region and therefore permitted.<\/p><p><b>Gated on:<\/b> Twilight's Promise quest state reaching FINISHED.<\/p><p><b>Why the gate fits:<\/b> it is the plugin's core job &mdash; deciding which travel is legal &mdash; expressed as a reward rather than a restriction.<\/p><p><b>Feasibility:<\/b> easy. A boolean in the existing spell-blocking set plus a widget highlight.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Twilight%27s_Promise\">Wiki: Twilight's Promise<\/a>"}, {"id": "pendant-destination-pins", "title": "Unlock Pendant of Ates destination pins after Death on the Isle", "summary": "Tile markers and map pins for each activated statue and landing spot, including North Aldarin.", "html": "<p>The pendant's six destinations &mdash; The Darkfrost, Twilight Temple, Ralos' Rise, North of Kastori, Nemus Retreat and North Aldarin &mdash; only work once their statues are activated, and the North Aldarin destination is specifically a Death on the Isle reward. The overlay pins each landing spot on the world map, puts a tile marker at the arrival square, and greys out destinations whose statue has not yet been switched on.<\/p><p><b>Gated on:<\/b> Death on the Isle quest state, plus the Pendant of Ates item ID being held; per-destination state from statue-activation varbits (<b>unverified<\/b> indices) with a chat-message fallback.<\/p><p><b>Why the gate fits:<\/b> the pendant is a rare drop that starts inert, so a map of destinations you have not unlocked would be noise.<\/p><p><b>Feasibility:<\/b> easy for static coordinates gated on quest state; medium for accurate per-statue state until varbits are confirmed.<\/p><p><b>Challenge:<\/b> Pins the wrong set of places: the correct six are The Darkfrost, Twilight Temple, Ralos' Rise, North Aldarin, North of Kastori and Nemus Retreat. The overlay should also surface charges, since a pendant with statues lit and no frozen tears loaded looks identical to a working one until you click it.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Pendant_of_Ates\">Wiki: Pendant of Ates<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Death_on_the_Isle\">Wiki: Death on the Isle<\/a>"}, {"id": "moons-loot-infobox", "title": "Unlock a Moons of Peril loot infobox after Perilous Moons", "summary": "Per-Moon kill counts, chest opens, and a dry-streak counter against the 1/224 unique rate.", "html": "<p>After the quest, an infobox tracks kills of Blue, Blood and Eclipse Moon, how many times the Lunar Chest has been opened, and which of the thirteen uniques are still missing. Since each unique sits at 1/224 and full completion averages around 320 chest opens, a dry counter is genuinely informative rather than decorative. It also reminds the player that all three Moons must be beaten once before the chest opens at all.<\/p><p><b>Gated on:<\/b> Perilous Moons quest state.<\/p><p><b>Why the gate fits:<\/b> the chest does not exist before the quest, and the infobox would otherwise clutter the screen for accounts that cannot reach it.<\/p><p><b>Feasibility:<\/b> easy. Chat-message parsing for kills and loot, config persistence, standard infobox rendering.<\/p><p><b>Challenge:<\/b> The 1/224 rate, thirteen uniques, ~320 average opens and the all-three-Moons-first rule are all correct. The feature is the problem: core Loot Tracker plus the collection log already give kills, opens and missing uniques, and \"which of the thirteen are still missing\" specifically requires reading the collection log, which is only possible while its interface is open. Merge the dry counter into the Perilous Moons milestone and drop the infobox.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Lunar_Chest\">Wiki: Lunar Chest<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Moons_of_Peril\">Wiki: Moons of Peril<\/a>"}, {"id": "mixology-shopping-list", "title": "Unlock the Mixology shopping list after Herblore 60", "summary": "An infobox naming exactly which reward-shop items to buy first, in the order a bankless account needs them.", "html": "<p>Mastering Mixology at the Alchemical Society in Aldarin needs Herblore 60 and Children of the Sun, runs at roughly 45,000 XP/hr passive and 70,000 XP/hr active at level 81, and unlocks all recipes at 81. Its reward shop is the region's only source of prayer potions and antipoison. The infobox ranks the shop for a UIM: reagent pouch and potion storage first (they are the closest thing to bank space this account will ever get), then the potion packs, then alchemist's amulet, prescription goggles and the chugging barrel.<\/p><p><b>Gated on:<\/b> Herblore level reaching 60, checked on <code>StatChanged<\/code> and on login.<\/p><p><b>Why the gate fits:<\/b> 60 is the actual entry requirement, so the advice appears the day it becomes actionable.<\/p><p><b>Feasibility:<\/b> easy. A skill-level read plus a static ranked list; no game state touched.<\/p><p><b>Challenge:<\/b> Herblore 60, all-recipes-at-81 and both XP rates are correct. Two issues. The reward shop is priced in Mox, Aga and Lye rather than coins, so a \"buy in this order\" list needs three currencies and their earn rates to mean anything. And a Mixology plugin already exists on the Hub — the part that belongs in a region-lock plugin is narrower: the reagent pouch and potion storage are the only bank-shaped objects a Varlamore UIM will ever own, and that argument fits inside the key-items checklist.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Mastering_Mixology\">Wiki: Mastering Mixology<\/a>"}, {"id": "valuables-overlay", "title": "Unlock the Stealing Valuables house overlay after Thieving 50", "summary": "Highlights which Civitas illa Fortis houses currently hold a valuable and where Oriana is.", "html": "<p>Stealing Valuables opens at Thieving 50 in Civitas illa Fortis; the wiki calls it a \"low intensity training method for medium profit and experience rates\", and valuables sell to Oriana for 55 gp each &mdash; 65 gp once Gladiator rank is earned at the Colosseum. An overlay that highlights active houses, tracks the current run's take, and pins Oriana turns a slow grind into a routed one. Incidental clue scrolls, jewellery and blessed bone statuettes get their own counter.<\/p><p><b>Gated on:<\/b> Thieving level 50.<\/p><p><b>Why the gate fits:<\/b> the activity is inaccessible below 50, and the overlay reduces tedium in exactly the content the wiki flags as tedious.<\/p><p><b>Feasibility:<\/b> medium. Requires per-house object or NPC state scanning, which is a well-trodden pattern in RuneLite overlays but more work than a static coordinate list.<\/p><p><b>Challenge:<\/b> Misquoted: the wiki says \"medium profit and experience rates\", not \"modest\", and the 55 gp figure is only the pre-Gladiator rate. Beyond the numbers, the interesting design point the item misses is that this activity is one of the region's Prayer inputs &mdash; blessed bone statuettes drop here and break down into shards for the libation bowl, so the overlay's counter should feed the Prayer tracker rather than stand alone.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Stealing_valuables\">Wiki: Stealing valuables<\/a>"}, {"id": "master-rumour-tracker", "title": "Unlock the master rumour tracker after At First Light", "summary": "Master-tier rumour routing: which creature, which trap, which corner of the Savannah.", "html": "<p>At First Light (Hunter 46, Herblore 30, Construction 27, plus Eagles' Peak from outside the region) is the gate on Master-tier rumours from Guild Hunter Wolf, which also require Hunter 91. Once unlocked, the tracker parses the current assignment, names the trap type it needs (box, deadfall, butterfly net, pitfall, net trap), pins the hunting ground on the map, and shows progress toward the 100- and 250-rumour blueprint milestones.<\/p><p><b>Gated on:<\/b> At First Light quest state, plus Hunter level 91 for the master tier specifically.<\/p><p><b>Why the gate fits:<\/b> master rumours are the endgame Hunter content and the reason the Guild exists; the tracker arrives with them.<\/p><p><b>Feasibility:<\/b> easy to medium. Assignment text is chat- and widget-readable; the trap and location mapping is a static lookup table.<\/p><p><b>Challenge:<\/b> At First Light's requirements, the Master 91 gate and Guild Hunter Wolf are all correct. But this duplicates the Hunter Rumours plugin on the Plugin Hub almost feature for feature — assignment parsing, trap type, hunting-ground pins — and a Hub reviewer will ask why a region-lock plugin ships a second one. Merge whatever survives into the single rumour counter and cut the routing.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Hunters%27_Rumours\">Wiki: Hunters' Rumours<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/At_First_Light\">Wiki: At First Light<\/a>"}, {"id": "libation-bowl-calculator", "title": "Unlock the libation bowl calculator after Prayer 30", "summary": "Shard-to-XP maths for the Teomat offering loop, the region's main Prayer method.", "html": "<p>Blessed bone shards come from mining calcified rocks (Mining 41, 1&ndash;3 shards per ore at a 74/75 success rate), from chiselling bones blessed at the exposed altar south of the Teomat, and from rummaging Vale Totems offerings. Sacrificing them at the Teomat libation bowl needs Prayer 30 and gives 5 XP per shard with blessed wine or 6 XP with blessed sunfire wine. The infobox shows carried shards, wine type, XP to next level, and a pin for the altar and bowl.<\/p><p><b>Gated on:<\/b> Prayer level 30, optionally also requiring a first blessed bone shard in inventory.<\/p><p><b>Why the gate fits:<\/b> 30 Prayer is the real sacrifice requirement, and with no holy symbol or gilded altar in the region this loop <i>is<\/i> Varlamore Prayer training.<\/p><p><b>Feasibility:<\/b> easy. Inventory counts and arithmetic against the XP table.<\/p><p><b>Challenge:<\/b> Every number checks out: Prayer 30, 5 XP per shard, 6 with blessed sunfire wine, Mining 41 calcified rocks at 1–3 shards and 74/75. It is still shards multiplied by five, which an XP tracker already shows. Merge it into the Prayer row of the skill atlas — and while doing so, add the shard source the document keeps missing: the Colossal Wyrm Agility Course, 22–38 shards per scoop at 80%.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Blessed_bone_shards\">Wiki: Blessed bone shards<\/a>"}, {"id": "colosseum-respawn-planner", "title": "Unlock the death-pile planner after Challenger tier (5,000 glory)", "summary": "Setting your respawn to Civitas illa Fortis changes where every future death pile can be reached from.", "html": "<p>Challenger tier at 5,000 glory lets the player set their respawn point to Civitas illa Fortis. For an Ultimate Ironman that is not a convenience, it is a survival mechanic: items drop to the ground on death and despawn after an hour, so respawn distance is the whole recovery budget. The planner draws the walking route and estimated time from the Civitas illa Fortis respawn to wherever the player currently is, and flags areas from which an hour is not enough. Note the Brawler tier reward at 2,000 glory &mdash; bank chest access &mdash; is worthless on this account type, and the panel should say so.<\/p><p><b>Gated on:<\/b> best-glory tracker reaching 5,000, read from the Colosseum widget or chat.<\/p><p><b>Why the gate fits:<\/b> the planner only means anything once the respawn point can actually be moved.<\/p><p><b>Feasibility:<\/b> easy for straight-line distance and an hour countdown; a true pathed walking estimate is medium and probably not worth it.<\/p><p><b>Challenge:<\/b> The strongest idea in the section and factually clean. One caution on scope: a pathed walking estimate across Varlamore is a real routing problem, and the honest version is a straight-line distance plus the one-hour clock, which is what the item already concedes. Worth adding the fact that makes the planner sharper — the three in-region fairy rings (AIS, AJP, CKQ) and the quetzal network are the actual recovery vehicles, so \"distance\" should mean \"distance to the nearest transport node\", not to the pile.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_Colosseum\">Wiki: Fortis Colosseum<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Ultimate_Ironman\">Wiki: Ultimate Ironman<\/a>"}, {"id": "ring-of-dueling-swap", "title": "Unlock the ring of dueling Colosseum menu swap after Hero tier (12,000 glory)", "summary": "One destination flips from blocked to allowed on a ring the region cannot even produce.", "html": "<p>Hero tier at 12,000 glory grants a ring of dueling teleport straight to the Colosseum. That destination is inside Varlamore, so the plugin should stop blocking it &mdash; and can go further, promoting it to the left-click option on the ring while continuing to block Duel Arena and Castle Wars. The ring itself is craftable in region, which makes this a genuinely earnable reward rather than a dead one: gold ore from the Stonecutter Outpost, a ring mould from Artima's, a cut emerald from Toci's Gem Store, and Lvl-2 Enchant at Magic 27 with a Tal Teklan cosmic rune.<\/p><p><b>Gated on:<\/b> best-glory tracker reaching 12,000.<\/p><p><b>Why the gate fits:<\/b> the plugin already allows and blocks ring destinations by menu-target text; this simply flips one entry at the moment the game itself grants it.<\/p><p><b>Feasibility:<\/b> easy. It is a one-line change to the existing per-destination allow logic plus a <code>MenuEntry<\/code> swap.<\/p><p><b>Challenge:<\/b> The gag is built on a false premise. A ring of dueling can be made without leaving Varlamore &mdash; gold ore at the Stonecutter Outpost, ring mould at Artima's, cut emerald at Toci's, Lvl-2 Enchant with a cosmic from Tal Teklan &mdash; so this unlock pays off for any account that reaches Crafting 27 and Magic 27, not only an importer. That is the better story anyway: a five-shop supply chain the player assembles in order to cash in a Colosseum reward.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Fortis_Colosseum\">Wiki: Fortis Colosseum<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Ring_of_dueling\">Wiki: Ring of dueling<\/a>"}, {"id": "charter-dock-unlock", "title": "Unlock the three in-region charter routes after Dizana's quiver", "summary": "The stand-in dock crews start selling passage again &mdash; but only between Sunset Coast, Aldarin and Fortis Cothon.", "html": "<p>Charter ships connect the three Varlamore coastal docks &mdash; Sunset Coast, Aldarin and Civitas illa Fortis (Fortis Cothon) &mdash; as well as the wider Gielinor network. The plugin currently replaces the crews with talking stand-ins who refuse all passage. On obtaining Dizana's quiver, the stand-ins change dialogue and the three intra-Varlamore routes become selectable, while every destination outside the region stays blocked. Antonia's informal Sunset Coast&ndash;Aldarin boat and Achilka's Kastori&ndash;Tal Teklan service can unlock alongside them.<\/p><p><b>Gated on:<\/b> Dizana's quiver item ID in inventory or equipment.<\/p><p><b>Why the gate fits:<\/b> beating Sol Heredit is the region's proof-of-mastery, and the reward is being trusted with the sea &mdash; without ever being allowed to leave.<\/p><p><b>Feasibility:<\/b> easy. Destination filtering by menu-target text is exactly what the existing blockers do; the dialogue change is stand-in NPC text the plugin already owns.<\/p><p><b>Challenge:<\/b> The three docks and the quiver gate are right, and the blocking half is already implemented in NpcTransportBlocker. Antonia's Sunset Coast–Aldarin boat and Achilka's Kastori–Tal Teklan service are unverified and should not ship as asserted routes. Worth stating the mechanism plainly too: the plugin can only consume the destination click in the charter dialogue — it cannot filter the server's route list, so every allowed destination must be matched by menu target text, exactly as the ring of dueling already is.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Charter_ship\">Wiki: Charter ship<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Dizana%27s_quiver\">Wiki: Dizana's quiver<\/a>"}, {"id": "completionist-panel", "title": "Unlock the completionist panel after The Final Dawn", "summary": "The full ladder collapses into one badge wall, plus an endgame kit checklist for a bankless account.", "html": "<p>The Final Dawn is the top of the quest line and the door to the Crypt of Tonali and Doom of Mokhaiotl. On completion the panel switches to a summary mode: every milestone as a badge, overall percentage, best Colosseum wave and glory, rumour count, quetzal sites built, and Moons uniques collected. Alongside it sits an endgame kit checklist &mdash; the untradeables and single-source tools this account must keep on its person, since there is no bank and death drops everything to the floor.<\/p><p><b>Gated on:<\/b> The Final Dawn quest state.<\/p><p><b>Why the gate fits:<\/b> a completionist view before completion is just a to-do list; after it, it is a trophy cabinet.<\/p><p><b>Feasibility:<\/b> easy. Cosmetic panel state over data the plugin already tracks, plus the inventory and equipment scan the key-items checklist already runs.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/The_Final_Dawn\">Wiki: The Final Dawn<\/a>"}, {"id": "x-termite-exchange", "title": "Unlock the termite exchange and wyrm teleport scroll after Agility 50", "summary": "The region's only Agility content pays in termites, and one of them buys an in-region teleport the blocker must allow.", "html": "<p>The Colossal Wyrm Agility Course in the Avium Savannah is the piece of Varlamore the whole document forgot: 50 Agility for the basic course, 62 for the advanced, and a currency of its own. Laps scoop 8&ndash;10 termites on the basic course and 12&ndash;21 on the advanced, with an 80% chance of 22&ndash;38 blessed bone shards alongside &mdash; which quietly makes it a better Prayer input than mining calcified rocks. Worm Tongue's Wares takes those termites for colossal wyrm teleport scrolls (40), amylase packs (100), graceful crafting kits (650) and calcified acorns (900).<\/p><p>The teleport scroll is the interesting one for this plugin: its destination is inside Varlamore, so it is a teleport the item blocker must <i>allow<\/i> rather than block, and it is earned rather than bought. The panel opens a termite ledger — carried termites, the four purchase thresholds, and shards banked toward the next Prayer level.<\/p><p><b>Gated on:<\/b> Agility level reaching 50, read on <code>StatChanged<\/code> and on login.<\/p><p><b>Why the gate fits:<\/b> 50 is the real entry requirement for the course, and the scroll is the first teleport in the region a player earns purely by grinding a skill rather than by finishing a quest.<\/p><p><b>Feasibility:<\/b> easy. Termite and shard counts are inventory item IDs; whitelisting the scroll is the same one-line destination check the ring of dueling already uses in <code>ItemTeleportBlocker<\/code>.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Colossal_Wyrm_Agility_Course\">Wiki: Colossal Wyrm Agility Course<\/a>"}]}, {"id": "other", "title": "Other ideas", "lead": "Nine features that do not fit a milestone ladder but make the locked account survivable and legible.", "intro_html": "<p>These are the supporting systems: the ones that stop a run ending badly, tell the player where the boundary actually is, and answer the question every locked account asks constantly &mdash; \"can I even train this here?\"<\/p><p>The death tracker in particular is not optional polish. An Ultimate Ironman gets no gravestone and cannot use Death's Coffer; everything drops to the floor and despawns in an hour. Knowing where the pile is and how long is left is the difference between a setback and a restart.<\/p>", "items": [{"id": "death-pile-tracker", "title": "Death pile tracker", "summary": "A world-map pin and a one-hour countdown for the exact tile where everything you owned just hit the floor.", "html": "<p>Ultimate Ironmen cannot keep any items on death through any means, including Protect Item; items drop directly to the ground rather than into a grave, and remain there for one hour before despawning. They also cannot use Death's Coffer at all, and get no discount at Death's Office &mdash; which is moot, because nothing reaches it. So the plugin should record the death tile, pin it on the world map and minimap, start a 60-minute infobox timer, and list what was carried at the moment of death so the player knows what they are running back for.<\/p><p><b>Detection:<\/b> the local player's death animation or the <code>ActorDeath<\/code> event on the local player, snapshotting <code>WorldPoint<\/code> plus the last known inventory and equipment contents from the most recent <code>ItemContainerChanged<\/code>.<\/p><p><b>Why it fits:<\/b> for a bankless account inside a region with long walks between quetzal sites, the recovery window is the single most consequential number on screen.<\/p><p><b>Feasibility:<\/b> easy. All client-side reads and a timer; the inventory snapshot must be taken continuously since the containers are empty by the time death fires.<\/p><p><b>Challenge:<\/b> The death mechanics are quoted correctly, down to the one-hour despawn and the pause on logout. The duplication is the risk: RuneLite's core Death Indicator already pins the death tile on the map. What is genuinely new here is the carried-inventory snapshot and the countdown, so lead with those. The snapshot must be maintained continuously from ItemContainerChanged, since both containers are empty by the time the death event fires — the item says this, and it is the one implementation detail that will actually break if skipped.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Ultimate_Ironman\">Wiki: Ultimate Ironman<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Death%27s_Office\">Wiki: Death's Office<\/a>"}, {"id": "boundary-warning", "title": "Boundary-crossing warning", "summary": "A screen-edge glow and chat warning when the player walks within a configurable distance of a locked chunk.", "html": "<p>The existing boundary checker already knows the allowed chunk set and updates per tick. Extending it from \"am I inside?\" to \"how close is the edge?\" gives an escalating warning: a subtle panel colour change at a few chunks out, a screen-edge vignette at one chunk, and a chat warning plus optional tile highlighting on the boundary line itself. Since travel out is blocked at the menu level, this is about accidental walking rather than teleports.<\/p><p><b>Detection:<\/b> compute the player's <code>WorldPoint<\/code> region ID each tick and test neighbouring region IDs against the allowlist; render boundary tiles where an allowed chunk abuts a locked one.<\/p><p><b>Why it fits:<\/b> the lock currently only speaks up when something is blocked; a warning turns it from a bouncer into a guide.<\/p><p><b>Feasibility:<\/b> easy. It reuses the existing <code>HashSet&lt;Integer&gt;<\/code> chunk lookup and standard overlay rendering.<\/p><p><b>Challenge:<\/b> Cheap, correct and reuses machinery that already exists. The gap it exposes is worth naming: the item says travel out is \"blocked at the menu level\", which is true for spells, items and the minigame tab but not for the three fairy rings inside Varlamore (AIS, AJP, CKQ). Until those are blocked, a proximity warning is guarding a door next to an open window.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Varlamore\">Wiki: Varlamore<\/a>"}, {"id": "region-map-overlay", "title": "Region map overlay", "summary": "Shade every chunk outside Varlamore on the world map, the way Region Locker does for chunk-locked accounts.", "html": "<p>The Region Locker plugin on the Plugin Hub already establishes the pattern: maintain a list of unlocked region IDs and render locked chunks as darkened on the world map. This plugin has a fixed allowlist rather than a growing one, so the overlay is simpler &mdash; shade everything that is not Varlamore, outline the region, and optionally colour-code sub-areas (Civitas illa Fortis, Avium Savannah, Tlati Rainforest, Hailstorm Mountains, Auburn Valley, Aldarin coast).<\/p><p><b>Detection:<\/b> no detection needed; it is a static render driven by the same <code>varlamore_regions.json<\/code> chunk set the boundary checker loads. Note that file currently holds placeholder region IDs pending in-game collection.<\/p><p><b>Why it fits:<\/b> the challenge is spatial, and a player who can see the cage understands it better than one who is told about it in chat.<\/p><p><b>Feasibility:<\/b> easy, with a well-known precedent. The world-map overlay API is public and Region Locker's approach is documented.<\/p><p><b>Challenge:<\/b> Feasible and well-precedented, but this is Region Locker with a hard-coded list, and a Hub reviewer will say so. The defensible framing is that the plugin ships the verified Varlamore allowlist so nobody has to click four hundred chunks by hand. That only holds once varlamore_regions.json contains real region IDs rather than the placeholders currently in the repo, which makes the boundary data collection a blocking dependency for this feature, not a follow-up.<\/p>", "source_html": "<a href=\"https://oldschool.runescape.wiki/w/Snowflake_account\">Wiki: Snowflake accounts (area-locked)<\/a> &middot; <a href=\"https://oldschool.runescape.wiki/w/Varlamore\">Wiki: Varlamore<\/a>"}, {"id": "skill-training-atlas", "title": "\"What can I train here?\" skill atlas", "summary": "A per-skill panel listing the best Varlamore-only method, its requirements, and an honest note where the region has no good answer.", "html": "<p>One row per skill. Hunter: Hunter Guild and Avium Savannah rumours from 46 up. Herblore: Mastering Mixology, all recipes at 81. Fletching: Vale Totems, oak totem ~254.8 XP per build up to redwood ~3,787.2, effectively training to 90+. Prayer: blessed bone shards at the Teomat libation bowl. Thieving: Stealing Valuables at 50, plus the Fortis Bazaar stalls. Mining: Stonecutter Outpost (clay 5, iron 35, silver 40, coal 50, gold 65, mithril 80), the Cam Torum iron and calcified rocks, Mistrock, and the Avium Savannah iron crevice. Smithing: furnac
